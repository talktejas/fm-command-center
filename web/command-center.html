<body>

<div class="shell">
  <aside class="rail">
    <div class="rail-head">
      <div class="brand">
        <h1>Command Center</h1>
        <span class="live" id="live"><span class="beat"></span>Live</span>
      </div>
      <div id="watcher"><div class="watcher"><span class="beat"></span><span>Checking…</span></div></div>
      <div class="search">
        <span class="mag">⌕</span>
        <input id="q" type="search" autocomplete="off"
               placeholder="Search everything — messages, items, your words…">
        <button class="clr" id="clr" hidden>×</button>
      </div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="waiting" aria-selected="false" title="Only what needs your answer or decision">Action <span class="n" id="n-waiting"></span></button>
        <button class="tab" role="tab" data-tab="messages" aria-selected="true" title="Important information from firstmate">Info <span class="n" id="n-messages"></span></button>
        <button class="tab" role="tab" data-tab="info" aria-selected="false" title="Repeats and nothing-new notes, kept so you can check nothing important was ignored">Ignore <span class="n" id="n-info"></span></button>
        <button class="tab" role="tab" data-tab="prs" aria-selected="false" title="Pull requests waiting for your merge word">PRs <span class="n" id="n-prs"></span></button>
        <button class="tab" role="tab" data-tab="work" aria-selected="false" title="Everything active: being worked on, or dormant waiting for you">Work <span class="n" id="n-work"></span></button>
        <button class="tab" role="tab" data-tab="agents" aria-selected="false" title="Every running worker and second mate, and the work each is on">Agents <span class="n" id="n-agents"></span></button>
        <button class="tab" role="tab" data-tab="archived" aria-selected="false">Archived <span class="n" id="n-archived"></span></button>
        <button class="tab" role="tab" data-tab="hold" aria-selected="false">Hold <span class="n" id="n-hold"></span></button>
      </div>
      <div class="groupbar">
        <label for="grouping">Group by</label>
        <select id="grouping">
          <option value="project">Project</option>
          <option value="worktree">Project + worktree</option>
          <option value="branch">Project + branch</option>
          <option value="latest">Latest first</option>
          <option value="oldest">Oldest first</option>
          <!-- Approved proposal section 6 names flat as its own selector entry. -->
          <option value="none">Nothing — one flat list</option>
        </select>
      </div>
      <div class="groupbar">
        <label for="projectfilter">Project</label>
        <select id="projectfilter"></select>
      </div>
      <!-- Approved proposal section 4: a state filter, so things are findable
           without scrolling. It narrows by facts only a Waiting-on-you item
           has, so it is shown on that tab alone. -->
      <div class="groupbar" id="statebar" hidden>
        <label for="statefilter">Show</label>
        <select id="statefilter">
          <option value="">Everything waiting</option>
          <option value="stuck">Only stuck workers</option>
          <option value="sent">Only answers sent, not acted on</option>
          <option value="dead">Only where nobody is listening</option>
          <option value="deferred">Only deferred</option>
        </select>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="rail-foot">
      <div class="capture-note" id="capture-note" hidden></div>
      <button class="notebtn" id="open-note">✎&nbsp; Tell firstmate something — not an answer</button>
    </div>
  </aside>
  <div class="gutter" id="gutter">
    <button id="gutter-archive" title="Archive" aria-label="Archive">🗄</button>
    <button id="gutter-hold" title="Hold" aria-label="Hold">⏸</button>
    <button id="gutter-delete" title="Delete for good" aria-label="Delete">🗑</button>
  </div>
  <main class="main" id="main"></main>
</div>

<!-- Approved proposal section 3: everything the captain types is logged, a note included. -->
<dialog id="note-dlg">
  <form method="dialog" class="dlg">
    <h3>Note to firstmate</h3>
    <p>Not answering anything — a thought, an instruction, a correction. It is queued for
       firstmate's next turn.</p>
    <textarea id="note-text" placeholder="Stop everything on JewelTrek until I have looked at 183."></textarea>
    <div class="reply-foot">
      <button type="button" class="attach-btn" data-attach-btn>📎 Attach image</button>
      <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple
        data-attach-input style="display:none">
    </div>
    <div data-attach-strip="note"></div>
    <div class="dlg-foot">
      <button class="defer" value="cancel">Cancel</button>
      <button class="send" value="send">Queue it</button>
    </div>
  </form>
</dialog>

<script src="command-center-state.js"></script>
<script>
"use strict";
// The rules above are a second request, so they can fail while this one does
// not. Every decision below is made by them, so without them the page would
// poll into a ReferenceError and sit showing an empty list and a Live beat -
// the silent false reassurance this surface exists to end. Say it instead.
if (typeof pollFacts !== 'function' || typeof captureBand !== 'function'){
  document.querySelector('#live').innerHTML =
    '<span class="lamp dead"></span>Page incomplete';
  document.querySelector('#watcher').innerHTML =
    '<div class="watcher" style="background:var(--hot-soft)"><span class="lamp dead"></span>' +
    '<span><b>This page did not load completely.</b> Its decision rules ' +
    '(command-center-state.js) are missing, so nothing here can be trusted or ' +
    'sent. Reload; if that does not fix it, restart the command center.</span></div>';
  throw new Error('command-center-state.js did not load');
}

// The page is a view. Every fact it shows comes from /api/items, which is
// bin/command-center-scan.sh reading firstmate's own records; the only thing
// the browser keeps is what is genuinely the captain's and nowhere else: an
// unsent draft, and which items he has already looked at.

// This page's own thresholds, defaulted to match firstmate's retry ladder
// (FM_TASK_INBOX_GRACE_SECS and FM_TASK_INBOX_RING_MAX in
// bin/fm-task-inbox-lib.sh). Nothing serves that environment to the browser, so
// if either is overridden there, change these to match.
const GRACE_SECS = 90, RING_MAX = 3;
const STUCK_SECS = GRACE_SECS * RING_MAX;
const POLL_MS = 3000;

const LISTEN = {
  busy:    { label:'Working right now',  say:'Mid-turn. It sees your answer when this turn ends.' },
  idle:    { label:'Waiting for you',    say:'Alive and idle. Your answer arrives straight away.' },
  unknown: { label:'Cannot tell',        say:'No trustworthy signal recently. Your answer is still saved, but nobody can promise it is being watched.' },
  dead:    { label:'Not running',        say:'Nobody is listening. Your answer is saved and firstmate picks it up — nothing is lost, but nothing happens until it does.' },
  none:    { label:'No worker',          say:'Nobody is working on this. It is a question held for you; firstmate acts on your answer.' },
  // Served from bin/command-center.py's remember_waiting: the scan stopped
  // listing it, and only his own Archive or Hold takes it off this list.
  closed:  { label:'Closed on firstmate’s side', say:'Firstmate’s records no longer list this as open. It stays here until you archive or hold it, and an answer still reaches firstmate.' },
};
const HOME_COLOURS = ['#1f5fd0','#177245','#6b34b8','#b45309','#b3261e'];

// An unconfirmed delivery leaves a standing verdict on the item, not a line of
// text the next poll's re-render wipes, because it forbids a resend. A plain
// failure leaves none: nothing was delivered, so sending again is the fix.
const SEND_VERDICT = {
  unknown: {
    label: 'Delivery unknown — do not resend',
    note: '<b>Delivery could not be confirmed.</b> It may already have reached the '
        + 'worker, so do not send it again until you know. The reason follows:',
  },
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// His report 2026-09-24: "none of the link is fucking clickable" - every URL
// in his or firstmate's own words must be a real, clickable link, everywhere
// he reads one. This runs on ALREADY-ESCAPED text (esc()'s own output), so it
// only ever turns a literal http(s):// run esc() left untouched into an
// anchor - it never reinterprets anything he typed as markup. A sentence
// character stuck right against the end of a URL (a period, a closing
// bracket, ...) almost never belongs to it, so it is peeled back off the link.
//
// A file address is a dead end here (no browser follows one from an http
// page), so one into firstmate's documents (DOCS, the server's docs_dir) -
// bare, file:///..., or the file://wsl.localhost/<distro>/... form a Windows
// browser was handed - links to the same file served at /doc/<path>. A file
// address anywhere else stays plain text: a link that does nothing is worse.
const DOCS = '__DOCS__';
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const LINK_RE = new RegExp('(https?://[^\\s<>"]+' + (DOCS.root
  ? '|(?:file://(?:wsl\\.localhost|wsl\\$)/[^/\\s<>"]+|file://)?' + reEsc(DOCS.root) + '/[^\\s<>"]+'
  : '') + ')', 'g');
function linkify(escapedText){
  return String(escapedText || '').replace(LINK_RE, url => {
    let trail = '';
    for (;;) {
      if (url.endsWith('&quot;')) { trail = '&quot;' + trail; url = url.slice(0, -6); }
      else if (url && /[.,!?;:)\]}`*']/.test(url[url.length - 1])) {
        trail = url[url.length - 1] + trail;
        url = url.slice(0, -1);
      } else break;
    }
    if (!url) return trail;
    let href = url;
    if (!/^https?:/.test(url)) {
      const rel = url.slice(url.indexOf(DOCS.root) + DOCS.root.length + 1);
      const ext = (rel.match(/\.([A-Za-z0-9]+)$/) || [])[1];
      if (!ext || !DOCS.types.includes(ext.toLowerCase())) return url + trail;
      href = '/doc/' + encodeURI(rel).replace(/[?#]/g, encodeURIComponent);
    }
    return `<a href="${href}" target="_blank" rel="noopener">${url}</a>${trail}`;
  });
}
// Every place on this page that shows firstmate's or his own free text goes
// through one of these two, so a clickable link is never a call site an
// editor can forget to add: a plain line (escape, then link) or a
// multi-paragraph body (blank-line-separated, single newlines kept as <br>,
// each paragraph escaped and linked the same way).
const linked = t => linkify(esc(t));
// A Markdown table in a message (his report 2026-10-05: "it doesnt display
// tables properly here") renders as a real table, inside its own scroll box so
// a wide one never breaks the pane. Cells get the same escaping and links as
// any other text, and only **bold** is read from the markup - the text is
// escaped before anything here looks at it, so no raw HTML gets through.
const isTableBlock = lines => lines.length >= 2 && /\|/.test(lines[0])
  && /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(lines[1]);
const tableRow = line => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|')
  .map(c => linkify(c.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'));
const tableHtml = lines => {
  const [head, ...body] = lines.filter((l, i) => i !== 1);
  return `<div class="msg-table"><table><thead><tr>${tableRow(head).map(c => `<th>${c}</th>`).join('')}</tr></thead>`
    + `<tbody>${body.map(l => `<tr>${tableRow(l).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};
const para = t => esc(t).split(/\n{2,}/).map(block => {
  const lines = block.split('\n');
  return isTableBlock(lines) ? tableHtml(lines)
    : `<p>${linkify(block).replace(/\n/g, '<br>')}</p>`;
}).join('');

const state = {
  tab:'messages', group:'project', sfilter:'', q:'', project:'',
  open:null, view:{homes:[],items:[]}, prs:[], prsError:null, said:[], messages:[], archivedMessages:[], msgError:null,
  saidDropped:0, msgEtag:null, saidEtag:null,
  // The page holds the newest window of the log; the rest is one click away
  // and searchable whole, and `capture` is the health of the automatic
  // recording that fills it.
  capture:null, more:false, archivedMore:false, found:null, archivedFound:null,
  total:0, archivedTotal:0, openMsg:null, openNote:'', archiving:null,
  applied:load('cc.applied',{}),
  // A send in flight, by sid: what he typed and where he typed it. His words
  // leave the box only when the outcome row says the send landed.
  pending:load('cc.pending',{}), failed:load('cc.failed',{}),
  msgRead:false, etag:null,
  // The /bearings lavish board's four sections, read on their own slow poll
  // (loadWork below) rather than the item scan's change-driven one.
  work:{captains_call:[],underway:[],landed:[],charted:[],omitted:[],items:[],agents:[],error:null},
  workSort:'project', workDoneOpen:new Set(),
  workRead:false, workSending:{},
  // The bucket order a Group by view is showing, kept across polls so a new
  // row's time never moves the bucket he is reading - see groupBuckets below.
  groupOrder:{mode:null, order:[]},
  // Multi-select on the Messages list: shift-click a range, ctrl/cmd-click
  // to add or drop one row, then one Hold or Archive for the whole selection.
  // Not persisted - a fresh load or tab switch starts with nothing selected.
  selected:new Set(), bulkBusy:false,
  // Keys (msg/<id> or itemKey) deleted this session: the server already
  // leaves them out, this only stops a poll already in flight, or a message
  // mergeMessages keeps from an older window, bringing one back meanwhile.
  deleted:new Set(), deleteArmed:null,
  sending:false, flash:null, error:null, seen:load('cc.seen',{}), draft:load('cc.draft',{}),
  // Pasted/dropped images attached to a reply, by the same conversation key
  // as draft: {id, name} per image, uploaded as soon as they're attached so
  // a send just names ids. Cleared for a key once that reply is accepted.
  images:load('cc.images',{}), imageErr:{},
  note:load('cc.note',''), outcome:load('cc.outcome',{}), scanned:false, saidError:null,
  offline:null, unread:null, confirmed:false, readAt:null,
  // A message's own explicit Archive/Restore, kept until the opposite click:
  // a /api/messages poll already in flight when he clicks can still land
  // afterward reading the log from just before the write, so its answer must
  // never be allowed to undo what he just did. See applyArchiveOverride.
  archiveOverride:{},
};

// Browser storage, wrapped: a private window or cleared site data must degrade
// to "no draft remembered", never to a broken page.
function load(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) || fallback; }
  catch (e) { return fallback; }
}
function save(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* not fatal */ }
}

// --- a deploy reaches the open tab ---------------------------------------------
// The page never reloads on its own, so without this the tab he opened before a
// deploy runs the old code for as long as it stays open - no-store on the page
// changes nothing for a page that is never asked for again (his report
// 2026-09-28: Archive/Hold on his notes "still" missing, an hour after the fix
// shipped). The server stamps this page with its build (page_version,
// command-center.py) and names the current one on every answer; when they
// differ the page reloads itself, but never under his fingers: not while a box
// has his focus in a visible tab, nor with a write still on its way. What he
// was looking at comes back with it (cc.resume, read once below).
const PAGE_VERSION = '__PAGE_VERSION__';
let writing = 0;
function reloadIfStale(res){
  const v = res.headers.get('X-Page-Version');
  if (!v || v === PAGE_VERSION) return;
  const typing = !document.hidden && document.activeElement
    && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing || writing || state.sending || state.bulkBusy) return;  // the next poll asks again
  try {
    sessionStorage.setItem('cc.resume', JSON.stringify({ tab: state.tab, open: state.open,
      group: state.group, project: state.project, sfilter: state.sfilter }));
  } catch (e) { /* he lands on the default view, on the new code */ }
  location.reload();
}
try {
  Object.assign(state, JSON.parse(sessionStorage.getItem('cc.resume')) || {});
  sessionStorage.removeItem('cc.resume');
} catch (e) { /* a fresh view */ }

// --- honest time -------------------------------------------------------------
// since_kind says which clock a row actually has. A row with none is never given
// a guessed position or a made-up age; it says so instead.
const nowSecs = () => Math.floor(Date.now() / 1000);
const agoWords = s => s < 60 ? Math.max(0, s) + ' seconds' : Math.round(s / 60) + ' minutes';
// Records stay UTC; every time this page SHOWS is his own clock, because that
// is the clock he reasons against. Half a page in each is worse than either.
const localTime = iso => {
  const t = Date.parse(iso || '');
  return isNaN(t) ? '' : new Date(t).toLocaleString();
};
// ageWords (web/command-center-state.js): now minus a recorded instant; a
// date-only record is worded by the day.
const ageLabel = it => ageWords(it.since_epoch, nowSecs());
// The three labels every card carries, same place, same order (cardLabels).
const labelsHtml = r => `<span class="labels" title="${esc(cardLabels(r).map(l =>
    l.missing ? l.text : l.key + ' ' + knownValue(r[l.key])).join(' · '))}">${cardLabels(r).map((l, i) =>
  (i ? '<span class="sep">·</span>' : '')
  + `<span class="${l.missing ? 'lbl-miss' : i ? 'mono' : ''}">${esc(l.text)}</span>`).join('')}</span>`;
const ageTitle = it => it.since_kind === 'hold-set'
  ? 'from the moment the question was put to you'
  : it.since_kind === 'question'
  ? 'from the newest question recorded for this task'
  : it.since_kind === 'recorded'
  ? 'from the moment it was recorded'
  : it.since_kind === 'backlog-mtime'
  ? 'from when its backlog entry was last written - no earlier time was recorded'
  : it.since_kind === 'status-timestamp'
    ? 'from the moment the worker opened this decision'
    : it.since_kind === 'status-mtime'
      ? 'from when the worker last wrote to its log — this line carries no timestamp, so this is the closest honest clock'
      : 'this record carries no time at all';

// --- derived per-item state --------------------------------------------------
const sentUnhandled = it => (it.sent || []).filter(m => !m.handled);
function stuckFor(it){
  const pending = sentUnhandled(it);
  if (!pending.length) return 0;
  const oldest = pending.map(m => Date.parse(m.at || '') / 1000)
                        .filter(n => !isNaN(n)).sort((a,b) => a - b)[0];
  if (!oldest) return 0;
  const waited = nowSecs() - oldest;
  return waited >= STUCK_SECS ? waited : 0;
}
const isStuck   = it => stuckFor(it) > 0;
const isPending = it => sentUnhandled(it).length > 0 && !isStuck(it);
const isDeferred = it => Boolean(it.deferred_until) &&
  /^\d{4}-\d{2}-\d{2}$/.test(it.deferred_until) &&
  Date.parse(it.deferred_until + 'T00:00:00Z') / 1000 > nowSecs();
// A task can be captain-held AND stopped on its own status record at once; the
// two are answered by different commands, so home+id alone would merge them into
// one row and one draft. itemKey comes from bin/command-center-state.js.
const isUnread = it => !state.seen[itemKey(it)];
// --- explicit archiving and holding --------------------------------------------
// One click, no confirmation, on any row: Messages, Waiting-on-you.
// Never automatic - a reply or an answer never moves anything here on its own.
// Durable on the server (command-center.py's /api/park, parked.jsonl) rather
// than browser storage, so it survives a refresh and reads the same from any
// browser - a message's own Archive stays on the log it already had
// (/api/archive) since that already works; everything else, including a
// message's Hold, goes through /api/park. The object's own `archived`/`held`
// fields are what the server just told this poll (annotated in
// command-center.py); setting one here also mutates that field on the spot,
// for an instant row without waiting on the round trip, and the next poll
// carries the same truth back from the server, park action already landed.
const isItemArchived = it => !!it.archived;
const isItemHeld = it => !!it.held;
const isMsgHeld = m => !!m.held;
function park(target, key, state_){
  post('/api/park', {target, key, state: state_}).catch(() => { /* next poll reconciles */ });
}
// Stamped here too, so a row he just archived is on top of Archived before
// the next poll brings back the server's own archived_at.
const nowIso = () => new Date().toISOString();
function setItemArchived(it, archived){
  it.archived = archived;
  it.archived_at = archived ? nowIso() : null;
  park('item', itemKey(it), archived ? 'archived' : 'none');
}
function setItemHeld(it, held){
  it.held = held;
  park('item', itemKey(it), held ? 'held' : 'none');
}
function setMsgHeld(m, held){
  m.held = held;
  park('message', m.id, held ? 'held' : 'none');
}
// --- what firstmate SAID -----------------------------------------------------
// bin/fm-captain-message.sh writes one record per message; this page is the
// only place they are read back. A message carries the same project, worktree
// and branch fields an item does, so the grouping, the ordering and the search
// below work over both lists unchanged.
// shapeMessage and the ordering rule come from bin/command-center-state.js.
const msgKey = m => 'msg/' + m.id;
// visible() (below) mixes scanned items with __msg-tagged messages that need
// a reply; wherever their keys are walked together (advance-to-next after an
// archive/hold) each row must be keyed the way it actually opens by, or a
// message next to the archived row gets a bogus itemKey() that opens nothing.
const rowKey = it => it.__msg ? msgKey(it) : itemKey(it);
const repliesTo = m => state.said.filter(r => r.msg === m.id);
// A conversation's own thread: his replies, oldest first, interleaved with
// whatever firstmate answer the matching rule attaches to each one
// (threadRows, bin/command-center-state.js), looked up in every message the
// page holds, archived ones included: an answer he archives still threads
// under the message it answers wherever that one sits (his question
// 2026-09-28, "but what if i have already archived that message?"). An answer
// that has aged out of both windows simply does not thread, same as it would
// not be found anywhere else on the page either.
function heldMessages(){
  const ids = new Set(state.messages.map(m => m.id));
  return state.messages.concat(state.archivedMessages.filter(m => !ids.has(m.id)));
}
const threadEntries = repliesOldestFirst => threadRows(repliesOldestFirst, heldMessages());
// How long a reply has been waiting, in the same units ageLabel already
// speaks - built on the one clock the page trusts (nowSecs), not a second one.
const waitLabel = at => ageLabel({ since_epoch: Math.floor(Date.parse(at || '') / 1000) || null });
// The same "answered"/"awaiting firstmate" marker on every surface a
// conversation appears on - the list row and its opened pane -
// since it is one fact about one conversation. f-sent (green) matches the
// existing "replied"/"awaiting firstmate's explanation" convention below:
// waiting on firstmate is not an error state, so it never borrows f-stuck.
function threadBadgeHtml(status){
  if (!status) return '';
  return status.state === 'answered'
    ? '<span class="flag f-sent">answered</span>'
    : `<span class="flag f-sent">awaiting firstmate · ${esc(waitLabel(status.at))}</span>`;
}
// A note he sent from "Tell firstmate something" is its own conversation in
// Messages (noteThreads, bin/command-center-state.js): his note, then every
// answer firstmate recorded against it. Shaped like a message so grouping,
// ordering and the project filter work unchanged; the project is the first
// answer's, since a note records none of its own.
const noteKey = r => 'note/' + r.sid;
// Every note, whatever he has done with it; listedNotes/archivedNotes/heldNotes
// below are the three tabs one can be in. His note is a record on his board
// like any other (his report 2026-09-28): Archive, Hold and Delete, by his own
// hand, in any state, through the same /api/park record an item's use.
// Answers are looked up in every message the page holds, archived included -
// an answer he archived is still an answer (noteAnswer below).
function noteRows(){
  return noteThreads(state.said).filter(r => !state.deleted.has(noteKey(r))).map(r => {
    const answers = recordedAnswers(r, heldMessages());
    const at = Date.parse(r.at || '');
    return { __note: r, answers, id: r.sid, at: r.at, text: r.text,
      title: String(r.text || '').split('\n')[0].slice(0, 140) || '(empty note)',
      since_epoch: isNaN(at) ? null : Math.floor(at / 1000), home: 'main',
      archived: !!r.archived, archived_at: r.archived_at || null, held: !!r.held,
      project: (answers[0] || {}).project || null,
      worktree: (answers[0] || {}).worktree || null, branch: (answers[0] || {}).branch || null };
  });
}
const listedNotes = () => noteRows().filter(n => !n.archived && !n.held);
const archivedNotes = () => noteRows().filter(n => n.archived && !n.held);
const heldNotes = () => noteRows().filter(n => n.held);
const openedNote = () => noteRows().find(n => noteKey(n.__note) === state.open) || null;
const findNote = sid => state.said.find(r => r.kind === 'note' && r.sid === sid) || null;
// The conversation a note opened: every answer recorded against it, else the
// one matched by the moment (noteMomentAnswer, web/command-center-state.js),
// marked as matched so it never reads as recorded.
function noteEntries(n){
  const entries = threadEntries([n.__note]);
  if (entries.some(e => e.kind === 'firstmate')) return entries;
  const m = noteMomentAnswer(n.__note, heldMessages(), state.said);
  return m ? entries.concat([{ kind: 'firstmate', row: m, moment: true }]) : entries;
}
function setNoteArchived(r, archived){
  r.archived = archived;
  r.archived_at = archived ? nowIso() : null;
  park('note', r.sid, archived ? 'archived' : 'none');
}
function setNoteHeld(r, held){
  r.held = held;
  park('note', r.sid, held ? 'held' : 'none');
}
// Every row belongs to exactly one project choice: a row with no project
// (knownValue, web/command-center-state.js) is 'Not recorded', its own group
// and its own filter choice - never a reason to leave it out (his ruling
// 2026-09-28). Items are normalized here too, since they skip shapeMessage.
const NO_PROJECT = 'Not recorded';
const projectOf = it => knownValue(it.project) || NO_PROJECT;
// Jev's project replaced the label on this row (project_by); what was
// recorded with the message is still said, never dropped.
const recordedProject = m => !m.project_by ? ''
  : ` (recorded with it: ${knownValue(m.project_recorded) || 'no project'})`;
const homeOf = id => state.view.homes.find(h => h.id === id) || {id, name:id};
const homeColour = id => HOME_COLOURS[
  Math.max(0, state.view.homes.findIndex(h => h.id === id)) % HOME_COLOURS.length];

// The page holds the newest window and whatever older he has asked for; the log
// itself keeps everything, and ONE search reads it - the server's, over the
// whole log. A second matcher over the loaded rows would answer a different
// question with the same box.
// What the open key names: the rows the page holds, the rows a search served,
// or - once he has opened it - the message itself, which stays open however the
// search around it changes.
function openedMessage(){
  const find = rows => (rows || []).find(x => msgKey(x) === state.open);
  return find(state.messages) || find(state.archivedMessages)
    || find(state.found && state.found.rows) || find(state.archivedFound && state.archivedFound.rows)
    || (state.openMsg && msgKey(state.openMsg) === state.open ? state.openMsg : null);
}

function visibleMessages(allProjects){
  // The state filter names facts only a scanned ITEM has, so it is not
  // applied here rather than quietly hiding messages by a rule that cannot be
  // true of them; the project filter is (inProject) - a message has one too. Until the server has answered what he is
  // typing now, its last answer stays on screen under its own query.
  const archived = state.tab === 'archived';
  // One record, one tab (inMessagesTab, bin/command-center-state.js): a
  // message still waiting on him is listed only in Waiting on you, so a batch
  // here can never reach it. Archived rows are never waiting.
  const listed = archived ? m => !isMsgHeld(m) : m => inMessagesTab(m, state.said, state.view.items, state.prs, heldMessages());
  // Unsearched, a recorded answer is folded into the conversation it
  // continues (foldAnswers, bin/command-center-state.js) rather than listed on
  // its own; a search shows whatever matched, answers included.
  const rows = !state.q.trim()
    ? foldAnswers(archived ? state.archivedMessages : state.messages, state.said, heldMessages())
      .filter(listed)
    : ((archived ? state.archivedFound : state.found) || {}).rows
      ? (archived ? state.archivedFound : state.found).rows.filter(listed)
      : [];
  // Messages splits into two (his ask 2026-09-24): Info takes only genuine
  // noise, Messages everything else - since his report 2026-09-28, anything
  // isInfoOnlyMessage (web/command-center-state.js) cannot place stays in
  // Messages. Archived is not split - once archived, which of the two it
  // came from no longer matters.
  const tabRows = archived ? rows : rows.filter(m => isInfoOnlyMessage(m) === (state.tab === 'info'));
  return allProjects ? tabRows : tabRows.filter(inProject);
}

let SEARCH_SEQ = 0, SEARCH_TIMER = null;
function searchMessages(){
  clearTimeout(SEARCH_TIMER);
  const q = state.q.trim();
  const seq = ++SEARCH_SEQ;
  if (!q){
    if (state.tab === 'archived') state.archivedFound = null;
    else state.found = null;
    return;
  }
  const failed = detail => {
    if (seq !== SEARCH_SEQ) return;        // he has typed on since
    // Answered, with what happened: an unresolved search leaves the list
    // saying it is still searching over nothing, for as long as he looks at it.
    if (state.tab === 'archived') state.archivedFound = { q, rows: [], more: false, error: detail };
    else state.found = { q, rows: [], more: false, error: detail };
    renderList();
  };
  SEARCH_TIMER = setTimeout(async () => {
    try {
      const res = await fetch('/api/messages?q=' + encodeURIComponent(q)
        + (state.tab === 'archived' ? '&archived=1' : ''));
      if (!res.ok){ failed('the server answered ' + res.status); return; }
      const body = await res.json();
      if (seq !== SEARCH_SEQ) return;      // he has typed on since
      // The hits are kept beside what the page holds, never merged into it:
      // they come from anywhere in the log, while the held rows are one
      // contiguous newest-first run, which is what walking back through the
      // rest depends on. openedMessage() resolves either.
      const found = { q, rows: (body.messages || []).map(shapeMessage), more: !!body.more };
      if (state.tab === 'archived') state.archivedFound = found;
      else state.found = found;
      if (typeof body.total === 'number') {
        if (state.tab === 'archived') state.archivedTotal = body.total;
        else state.total = body.total;
      }
      renderList();
    } catch (e) { failed(String(e.message || e)); }
  }, 200);
}

function haystack(it){
  return [it.title, it.detail, it.project, it.worktree, it.branch, it.repo, it.id,
          ...(it.sent || []).map(m => m.text)]
    .filter(Boolean).join(' ').toLowerCase();
}

// Approved proposal section 4: the named state filter, so things are findable without scrolling.
function passesState(it){
  switch (state.sfilter){
    case 'stuck':    return isStuck(it);
    case 'sent':     return isPending(it);
    case 'dead':     return it.listen === 'dead';
    case 'deferred': return isDeferred(it);
    default:         return !isDeferred(it);   // deferred is out of the way by default
  }
}

// A captain hold from firstmate's backlog is not the only thing waiting on
// him: a captured message that was recorded as a question, or that plainly
// asks him to decide something, is too, until he replies to it (his report
// 2026-09-24: "I see many messages in the Messages group that need my input
// but are not in the Waiting on You group"). The state filter (stuck/sent/
// dead/deferred) names facts only a scanned item has, same as visibleMessages
// above, so a message only joins the default view, never a narrowed one.
function waitingMessages(){
  if (state.sfilter) return [];
  const q = state.q.trim().toLowerCase();
  // waitingMessageRows (bin/command-center-state.js) is pure over the messages,
  // what he said and the scanned items - opening a row or typing into it
  // touches none of those, so that can never shrink this list on its own (his
  // report 2026-09-24: "i had two items in waiting on you... clicked one... now
  // there was only 1"). A reply moves only the message it answers, to Messages.
  return waitingMessageRows(state.messages, state.said, state.view.items, state.prs, heldMessages())
    .filter(m => !q || haystack(m).includes(q));
}

function visible(allProjects){
  const q = state.q.trim().toLowerCase();
  const items = (state.view.items || []).filter(it => onHisBoard(it) &&
    !isItemArchived(it) && !isItemHeld(it) &&
    passesState(it) && (!q || haystack(it).includes(q)));
  const rows = items.concat(waitingMessages());
  return allProjects ? rows : rows.filter(inProject);
}
// Only what firstmate put to him is on any of his tabs (onHisBoard).
const boardItems = () => (state.view.items || []).filter(onHisBoard);
const archivedItemsList = () => boardItems().filter(isItemArchived);
// Archived is one list of every kind of row he can archive, drawn by the very
// row builders the other tabs use (his report 2026-09-28: "archiving changes
// where an item lives, never how it looks") and ordered by when each was
// archived, latest first. Messages are tagged copies, like visible()'s, so
// rowsHtml's row function and groupOf can tell them from items.
function archivedRows(){
  const q = state.q.trim().toLowerCase();
  const msgs = visibleMessages().map(m => Object.assign({__msg:true}, m));
  const items = archivedItemsList().filter(inProject)
    .filter(it => !q || haystack(it).includes(q));
  const notes = archivedNotes().filter(inProject).filter(n => !q || haystack(n).includes(q));
  return orderRows(msgs.concat(items, notes), state.group, true, archivedEpoch);
}
const archivedRowHtml = r => r.__note ? noteRow(r)
  : r.__msg ? messageRow(r, 'archived') : itemRow(r, 'archived');
const heldItemsList = () => boardItems().filter(isItemHeld);
const heldMessagesList = () => state.messages.concat(state.archivedMessages)
  .filter((m, i, all) => all.findIndex(x => x.id === m.id) === i && isMsgHeld(m));

// --- grouping ----------------------------------------------------------------
// These three drop the grouping. "Latest first" and "Oldest first" order by the
// best time each row actually has, and a row with no honest time is never given
// a position among the dated ones: it sits in its own tail and says why.
// 'none' is approved proposal section 6's flat entry and is genuinely unsorted -
// the order bin/command-center-scan.sh read the records in, nothing more.
const FLAT = new Set(['none','latest','oldest']);
// A message is not work: a field its record does not carry was never recorded,
// which is what the message pane says too. Only an ITEM can be unstarted.
function groupOf(it, isMessage){
  // A mixed list (Waiting on you now carries both scanned items and captured
  // messages needing a reply - see visible() below) tags each message row
  // with __msg itself, since one list-wide isMessage flag cannot say which
  // row is which.
  const msgish = isMessage || Boolean(it.__msg);
  const p = projectOf(it);
  const worktree = knownValue(it.worktree), branch = knownValue(it.branch);
  if (state.group === 'project') return { key:p, g1:p, g2:undefined };
  if (state.group === 'worktree')
    return { key:p+'\u0000'+(worktree||''), g1:p, g2:worktree, none:!worktree,
             noneLabel: msgish ? 'Not recorded' : 'Not started — no working copy yet' };
  return { key:p+'\u0000'+(branch||it.branch_state), g1:p, g2:branch,
           none:!branch,
           noneLabel: msgish ? 'Not recorded'
             : it.branch_state === 'detached'
               ? 'Detached scratch copy — no branch'
               : 'Not started — no branch yet' };
}

const ordered = (rows, newestDefault) =>
  orderRows(rows, state.group, newestDefault);

// The order rows actually APPEAR in on screen when Group by groups them
// (rowsHtml below): each bucket in the order its first row was reached, and
// within a bucket every row in that same order. "Next after an archive" must
// walk this order, not the flat chronological one ordered() gives alone -
// otherwise the row after the one he just archived can belong to a whole
// different project, and the group he was reading jumps out from under him
// (his report 2026-09-22: "the whole project went away and the next project
// came up"). With no grouping active (Latest/Oldest/Nothing) the two orders
// are the same thing.
// The bucket order for a Group by view, stable across polls (stableGroupOrder
// in bin/command-center-state.js): built once from the chosen key and then
// only ever added to at the end, never re-sorted by whatever a poll's time
// order says today. Rows within a bucket keep the time order `rows` already
// arrived in.
function groupBuckets(rows, isMessage){
  const map = new Map();
  for (const it of rows){
    const g = groupOf(it, isMessage);
    if (!map.has(g.key)) map.set(g.key, {g, items:[]});
    map.get(g.key).items.push(it);
  }
  if (state.groupOrder.mode !== state.group) state.groupOrder = {mode:state.group, order:[]};
  state.groupOrder.order = stableGroupOrder(state.groupOrder.order, [...map.keys()],
    k => map.get(k).g);
  return state.groupOrder.order.map(k => map.get(k));
}

function displayOrder(rows, newestDefault, isMessage, keyFn){
  const sorted = ordered(rows, newestDefault);
  if (FLAT.has(state.group)) return sorted.map(keyFn);
  const out = [];
  for (const {items} of groupBuckets(sorted, isMessage))
    for (const it of items) out.push(keyFn(it));
  return out;
}

// --- render ------------------------------------------------------------------
// His ask 2026-09-28: one project dropdown instead of the home chips (which
// listed firstmate homes, not projects, and only ever narrowed Waiting on
// you). It lists every project the current tab's rows carry, with its count,
// and narrows every list tab to exactly that one; Work has no rows to narrow.
const inProject = r => !state.project || projectOf(r) === state.project;
function renderProjectFilter(){
  const rows = state.tab === 'waiting' ? visible(true)
    : state.tab === 'prs' ? state.prs
    : state.tab === 'work' ? (state.work.items || [])
    : state.tab === 'agents' ? (state.work.agents || [])
    : state.tab === 'hold' ? heldItemsList().concat(heldMessagesList(), heldNotes())
    : state.tab === 'archived' ? visibleMessages(true).concat(archivedItemsList(), archivedNotes())
    : visibleMessages(true).concat(state.tab === 'messages' ? listedNotes() : []);
  const counts = new Map();
  for (const r of rows) counts.set(projectOf(r), (counts.get(projectOf(r)) || 0) + 1);
  // The chosen project stays listed even while this tab has none of it, so
  // the dropdown never silently shows a choice he did not make. 'Not recorded'
  // is always listed, last, so rows with no project are always one choice away.
  if (state.project && !counts.has(state.project)) counts.set(state.project, 0);
  if (!counts.has(NO_PROJECT)) counts.set(NO_PROJECT, 0);
  const names = [...counts.keys()].sort((a, b) =>
    (a === NO_PROJECT) - (b === NO_PROJECT) || a.localeCompare(b));
  const sel = $('#projectfilter');
  const html = `<option value="">All projects (${rows.length})</option>` + names.map(n =>
    `<option value="${esc(n)}">${esc(n)} (${counts.get(n)})</option>`).join('');
  // Rebuilt only on a real change: a 3-second poll must not close the
  // dropdown out from under him while he is choosing.
  if (sel.dataset.html !== html){ sel.innerHTML = html; sel.dataset.html = html; }
  sel.value = state.project;
}

// STANDING RULE for every notice slot on this page: two independent persistent
// facts never share one slot, and no notice returns early over another. Each
// one that applies is rendered; none of them can push another off the screen.
function renderWatcher(){
  const notices = [];
  const band = (tone, lamp, html) =>
    `<div class="watcher" style="background:var(--${tone})"><span class="lamp ${lamp}"></span>
     <span>${html}</span></div>`;
  const homes = state.view.homes || [];
  // Three reachability states, named by what he can DO in each. OFFLINE: the
  // fetch failed, nothing can be sent. UNREAD: the server answers but no scan
  // has ever published, so there is no list and it refuses sends too. ERROR: a
  // scan failed over a list an earlier one published, so the list may be short
  // but everything on it still answers. The last two leave the view stale, so
  // facts derived from it are history rather than claims about now.
  const offline = state.connected === false;
  // Tense and read time both come from bin/command-center-state.js.
  const { past, readAt } = tense(state, nowSecs());
  const asOf = past
    ? ` As at the last read${state.readAt
        ? ', ' + esc(new Date(state.readAt * 1000).toLocaleString()) : ''}.`
    : '';

  if (offline)
    notices.push(band('hot-soft', 'dead',
      `<b>Cannot reach the server.</b> ${esc(state.offline || '')} Nothing can be sent
       until it is back.`));
  if (state.unread)
    notices.push(band('hot-soft', 'dead',
      `<b>The records have not been read yet.</b> ${esc(state.unread)} Nothing here can
       be answered until they are.`));
  if (state.error)
    notices.push(band('hot-soft', 'dead',
      `<b>The last read of the records failed.</b> ${esc(state.error)} This list may be
       incomplete — what is on it can still be answered.`));

  // Holds HIDDEN from him - an unsupported backend, or a backlog that is there
  // and cannot be read. A home with no backlog file yet simply holds nothing.
  const unread = homes.filter(h => h.backlog_readable === false);
  if (unread.length)
    notices.push(band('hot-soft', 'dead',
      `<b>The backlog of ${unread.map(h => esc(h.name)).join(', ')} could not be read.</b>
       Anything held for you there is missing from this list — this is not the whole
       of it.${asOf}`));

  // Only the MAIN home's watch state is shown: every answer now routes to its
  // inbox regardless of which home an item belongs to, so a second mate's own
  // watcher state is no longer a fact that changes what he can do here.
  const main = homes.find(h => h.id === 'main');
  const mainStale = main && (!main.watcher_beat_epoch || readAt - main.watcher_beat_epoch > 300);
  if (main && mainStale)
    notices.push(band('warn-soft', 'unknown',
      `<b>Firstmate ${past ? 'was' : 'is'} not watching.</b> ${offline
        ? 'Nothing can be sent anywhere until this page can reach the server again.'
        : 'An answer you send is saved, but nothing will ring it until firstmate is back.'
      }${asOf}`));

  if (!homes.length){
    // The unread band above already says this, and better; it is the same fact.
    if (!state.unread)
      notices.push(band('warn-soft', 'unknown',
        `<b>No homes read yet.</b> Nothing here is a statement about firstmate's health.`));
  } else if (main && !mainStale) {
    notices.push(`<div class="watcher"${past ? ' style="background:var(--warn-soft)"' : ''}>
      <span class="${past ? 'lamp unknown' : 'beat'}"></span><span><b>Firstmate ${
        past ? 'was' : 'is'} watching</b> (heard ${
        agoWords(readAt - main.watcher_beat_epoch)} ago).${asOf}</span></div>`);
  }
  $('#watcher').innerHTML = notices.join('');
}

function itemRow(it, mode){
  const bits = [labelsHtml(it)];
  let flag = '';
  if (state.failed[itemKey(it)]) flag = '<span class="flag f-stuck">not sent</span>';
  else if (isStuck(it))   flag = '<span class="flag f-stuck">stuck</span>';
  else if (isPending(it)) flag = '<span class="flag f-sent">sent</span>';
  else if (isDeferred(it)) flag = `<span class="flag f-sent">until ${esc(it.deferred_until)}</span>`;
  else if (it.closed) flag = settledFlag(it);
  else {
    const answered = saidOnItem(state.said, itemKey(it)).slice().reverse();
    if (answered.length) flag = threadBadgeHtml(threadStatus(threadEntries(answered)));
  }
  const old = it.since_epoch && (nowSecs() - it.since_epoch) > 86400;
  return `<div class="row"><button class="item ${isUnread(it) ? '' : 'answered'} ${state.flash === itemKey(it) ? 'fresh' : ''}${
      state.selected.has(itemKey(it)) ? ' selected' : ''}"
      data-key="${esc(itemKey(it))}" aria-current="${state.open === itemKey(it)}">
    <span class="item-top">
      <span class="lamp ${esc(it.listen)}" title="${esc((LISTEN[it.listen]||LISTEN.unknown).label)}"></span>
      <span class="item-title">${esc(it.title)}</span>${flag}
      <span class="age ${old ? 'old' : ''}" title="${esc(ageTitle(it))}">${ageLabel(it)}</span>
      ${recvDotHtml(latestAnswerFor(it))}
    </span>
    <span class="item-sub">
      <span class="src"><span class="dot" style="background:${homeColour(it.home)}"></span>${esc(homeOf(it.home).name)}</span>
      ${bits.map(b => `<span class="sep">·</span>${b}`).join('')}
      <span class="sep">·</span><span class="kind k-${it.source === 'hold' ? 'decision' : 'blocker'}">${it.source === 'hold' ? 'decision' : esc(it.status_verb || 'blocked')}</span>
    </span>
  </button></div>`;
}

// Approved proposal sections 3 and 4: the archive and the thread are where a
// closure can honestly be shown - the server wrote this line as part of the very
// act that closed the decision, so nothing here is inferred.
// The dot beside each thing he sent, exactly as designed (his ruling
// 2026-09-22, kept 2026-10-05 - "I fucking told you to keep dots"): white ring,
// yellow, red, with the hover title it always had. Only WHEN it turns yellow
// changed: sendDot (web/command-center-state.js) calls a send delivered the
// moment it is in firstmate's inbox, not only once firstmate has read it.
const sendDotState = r => (sendDot(r, state.pending) || {}).state || null;
function recvDotHtml(r){
  const dot = sendDot(r, state.pending);
  if (!dot) return '';
  const cls = dot.state === 'failed' ? 'recv-failed' : dot.state === 'going' ? '' : 'recv-received';
  return `<span class="recv-dot ${cls}" title="${esc(dot.title)}"></span>`;
}
// The latest send FOR this row (a message or an item), for the list row's own
// dot - repliesTo/answered are newest-first already, so this is just [0].
const latestReplyTo = m => repliesTo(m)[0] || null;
const latestAnswerFor = it => saidOnItem(state.said, itemKey(it))[0] || null;
// The opened pane's own Archive button turns the same yellow as the dot,
// once the send he archived right after sending turns out to have arrived.
const archiveRecvClass = r => sendDotState(r) === 'read' ? 'recv-received' : '';

function wordOutcome(r){
  if (r.kind === 'draft') return 'Not sent. Kept here so it is not lost.';
  // sendState comes from bin/command-center-state.js: a row still reading
  // `sending` that the page has already given up on is not a send on its way.
  switch (sendState(r, state.pending)){
    case 'given-up':
      return 'Given up on. Nothing ever reported what became of it, so it may or '
           + 'may not have arrived';
    // Written down and on its way. The command has not answered yet, so
    // nothing is claimed about delivery until it does.
    case 'sending': return 'Going out now — the outcome appears when it answers';
    // An answer, a reply and a note all only ever reach firstmate's captain
    // inbox, so each says so in the same words: durably queued there, and
    // firstmate closes the decision itself once it reads it - never claimed
    // closed here.
    case 'sent': return 'Sent to firstmate.';
    case 'unknown':
      return 'Delivery unknown — it may already have arrived: ' + esc(r.detail || '');
    default: return 'Not sent — try again. ' + esc(r.detail || '');
  }
}

// #list is its own scroll container (.list{overflow-y:auto}), so assigning
// its innerHTML on every 3-second poll drops his scroll offset to the top -
// the page moving under him even once the bucket order above is stable. Kept
// only across a repaint of the SAME view: a real tab/group/filter change is
// meant to land at the top, a poll repaint of what he is already looking at
// is not.
let listPainted = null;
function paintList(html){
  const pane = $('#list');
  const sig = [state.tab, state.group, state.sfilter, state.project, state.q].join('\u0000');
  const same = sig === listPainted;
  const where = pane.scrollTop;
  pane.innerHTML = html;
  // Counted off the cards just drawn, so it is exactly what he can see.
  const lacking = [...pane.querySelectorAll('.row, .work-row')].filter(c =>
    [...c.querySelectorAll('.lbl-miss')].some(l => !l.textContent.startsWith('project'))).length;
  pane.insertAdjacentHTML('beforeend', `<div class="label-count">${lacking} item${
    lacking === 1 ? '' : 's'} without a worktree or branch</div>`);
  listPainted = sig;
  pane.scrollTop = same ? where : 0;
}

// The gutter is two fixed buttons, never re-created, so their disabled state
// is the only thing a render needs to keep current - enabled whenever there
// is something to act on (an open pane, or a selection even with no pane
// open, e.g. after Ctrl-clicking a row without opening it).
function renderGutter(){
  const has = state.selected.size > 0 || !!state.open;
  $('#gutter-archive').disabled = !has;
  $('#gutter-hold').disabled = !has;
  const del = deleteTargets();
  const armed = del.length > 0 && state.deleteArmed === del.join('|');
  $('#gutter-delete').disabled = !del.length;
  $('#gutter-delete').classList.toggle('armed', armed);
  $('#gutter-delete').title = armed ? `Click again to delete ${del.length === 1 ? 'it' : del.length}`
    : 'Delete for good';
  const paneDel = $('#main [data-delete-open]');
  if (paneDel){
    const paneArmed = state.deleteArmed === state.open;
    paneDel.classList.toggle('armed', paneArmed);
    paneDel.textContent = paneArmed ? 'Click again to delete' : 'Delete';
  }
}

// Forwards to whichever Archive/Hold button the open pane already has - one
// copy of the action, not a second one living in the gutter - or to the bulk
// actions when a multi-select is active. See CSS .gutter for why this exists.
function gutterArchive(){
  if (state.selected.size){ bulkArchiveSelected(); return; }
  const btn = $('#main [data-archive-item], #main [data-archive-msg], #main [data-archive-note]');
  if (btn) btn.click();
}
function gutterHold(){
  if (state.selected.size){ bulkHoldSelected(); return; }
  const btn = $('#main [data-hold-item], #main [data-unhold-item], ' +
    '#main [data-hold-msg], #main [data-unhold-msg], #main [data-hold-note], #main [data-unhold-note]');
  if (btn) btn.click();
}

// What the capture-health rules decide from (captureBand, handRecordedNote in
// web/command-center-state.js): the newest message the page holds and whether
// any work is underway. Read fresh each time, never cached.
function captureContext(){
  return { newestAt: newestMessageMs(state.messages.concat(state.archivedMessages)),
    nowMs: Date.now(), workActive: (state.work.underway || []).length > 0 };
}

// The hand-recorded state is a quiet line at the foot of the list, never a band
// at the top (his report 2026-10-05: "why the fuck is this coming?").
function paintCaptureNote(){
  const note = state.msgRead ? handRecordedNote(state.capture, captureContext()) : null;
  const el = $('#capture-note');
  el.textContent = note || '';
  el.hidden = !note;
}

function renderList(){
  renderGutter();
  markRepeats(state.messages);
  const items = state.view.items || [];
  // The server's own count of the current log, not the client's accumulated
  // cache: a message archived through any other route (another tab,
  // firstmate itself) never gets pruned from state.messages by a poll - it
  // just falls out of the fresh window and is kept as "not yet seen this
  // poll" - so that cache can grow past the true total and must never be
  // trusted as a floor for what the badge says.
  // Messages splits into Messages and Info (his ask 2026-09-24), so the server's
  // whole-log total can no longer be the badge for either half - text
  // classification only exists client-side, over whatever window is loaded.
  // Both badges are exactly what visibleMessages() would show for that tab,
  // the same window-based rule n-hold already uses.
  const unheldMsgs = foldAnswers(state.messages, state.said, heldMessages())
    .filter(m => inMessagesTab(m, state.said, state.view.items, state.prs, heldMessages()));
  const infoCount = unheldMsgs.filter(isInfoOnlyMessage).length;
  $('#n-messages').textContent = unheldMsgs.length - infoCount + listedNotes().length;
  $('#n-info').textContent = infoCount;
  $('#n-archived').textContent = state.archivedTotal
    + archivedItemsList().length + archivedNotes().length;
  $('#n-hold').textContent = heldItemsList().length + heldMessagesList().length
    + heldNotes().length;
  // waitingCount (bin/command-center-state.js) is pure over the scanned items,
  // the messages and what he said - opening a row or typing into it touches
  // neither, so this cannot move on its own (see waitingMessages above).
  $('#n-waiting').textContent = waitingCount(items, state.messages, state.said, nowSecs(), state.prs, heldMessages());
  // Every row Work lists unfolded: each item not yet done, plus a call only
  // Work carries. Finished items sit folded under Done, not counted.
  $('#n-work').textContent = workCalls().length
    + (state.work.items || []).filter(r => r.state !== 'done').length;
  $('#n-agents').textContent = (state.work.agents || []).length;
  $('#n-prs').textContent = state.prs.length;
  document.querySelectorAll('.tab').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)));
  $('#clr').hidden = !state.q;
  $('#statebar').hidden = state.tab !== 'waiting';
  renderProjectFilter(); renderWatcher(); paintCaptureNote();
  if (state.tab === 'messages' || state.tab === 'info'){ renderMessages(); return; }
  if (state.tab === 'archived'){ renderMessages(true); return; }
  if (state.tab === 'hold'){ renderHold(); return; }
  if (state.tab === 'work'){ renderWork(); return; }
  if (state.tab === 'agents'){ renderAgents(); return; }
  if (state.tab === 'prs'){ renderPrs(); return; }

  const rows = ordered(visible());
  const empty = state.q || state.sfilter ? 'Nothing matches.'
    : !state.scanned ? 'The records have not been read yet.'
    : 'Nothing needs your input.<br>Firstmate is getting on with it.';
  // loadMessages walks every unarchived message in before this list is built;
  // until it has, a question further back could be missing, so it says so.
  const partial = state.more ? `<div class="archive-note" style="background:var(--warn-soft)">
    Older messages have not all been read yet, so a question further back may be
    missing here — it is still in the log, and every poll tries again.</div>` : '';
  paintList(selectionBarHtml() + partial + rowsHtml(rows, it => it.__msg ? messageRow(it, 'list') : itemRow(it, 'list'), empty));
}

// On hold is only ever his own parking - nothing here was ever sent to
// firstmate, and nothing here is server-durable, unlike Archived's messages.
function renderHold(){
  const items = ordered(heldItemsList().filter(inProject));
  const msgs = ordered(heldMessagesList().concat(heldNotes()).filter(inProject), true);
  const sections = [
    ['Info', msgs, m => m.__note ? noteRow(m) : messageRow(m, 'held')],
    ['Action items', items, it => itemRow(it, 'held')],
  ].filter(([, rows]) => rows.length);
  paintList(sections.length
    ? sections.map(([title, rows, fn]) => `<div class="worksection"><h3>${esc(title)}
        <span class="n">${rows.length}</span></h3>${rows.map(fn).join('')}</div>`).join('')
    : `<div class="empty">Nothing on Hold.</div>`);
}

// Messages are the default list and the reason this page exists: everything
// firstmate said to him, newest first - the newest window of it, with the rest
// of the log one click away and searchable whole. The window arrives
// newest first (bin/command-center.py), so the grouped views are newest first
// without sorting anything; Latest and Oldest order explicitly as before.
function renderMessages(archived){
  const held = archived ? state.archivedMessages : state.messages;
  const more = archived ? state.archivedMore : state.more;
  const total = archived ? state.archivedTotal : state.total;
  const found = archived ? state.archivedFound : state.found;
  // Archived also carries the items he archived - see archivedRows.
  // Messages also lists his own notes (noteRows) - a search reads the log
  // server-side and never reaches them, so they are left out while one runs.
  const rows = archived ? archivedRows() : ordered(visibleMessages().concat(
    state.tab === 'messages' && !state.q.trim() ? listedNotes().filter(inProject) : []), true);
  let note = state.msgError
    ? `<div class="archive-note" style="background:var(--warn-soft)"><b>What firstmate
       said to you could not be read.</b> ${esc(state.msgError)} This is not the whole
       of it.</div>` : '';
  // Capture health is its own fact and gets its own band (captureBand in
  // bin/command-center-state.js): a broken capture must never look like a
  // short conversation.
  const cap = state.msgRead ? captureBand(state.capture, captureContext()) : null;
  if (cap) note += `<div class="archive-note" style="background:var(--warn-soft)">${esc(cap)}</div>`;
  const asked = state.q.trim();
  const answered = found ? found.q : '';
  const failed = asked && found && answered === asked && found.error;
  const empty = asked
    ? (failed ? 'The search could not be run: ' + esc(found.error)
              + ' — it runs again as you type.'
       : answered === asked ? 'Nothing matches.' : 'Searching the log…')
    : state.msgError ? 'The record could not be read.'
    : !state.msgRead ? 'The record has not been read yet.'
    : archived ? 'Nothing archived yet.' : 'Firstmate has not said anything to you yet.';
  // Nothing is dropped: the rest of the log is one click away, and a search
  // reaches all of it however far back it is - saying so where it found more
  // than it is showing.
  const searching = asked && found && answered === asked && !failed;
  // The window is a cap on the newest N, not a claim that only N exist:
  // archiving one lets the next-oldest slide in on the very next poll, which
  // without this line reads as the message he just archived coming back
  // (his report 2026-09-22 - the real cause was this truncation, not a
  // same-id reappear). Shown whenever the log holds more than the window,
  // independent of any archive action, so the line is never news to him.
  const older = searching
    ? (found.more ? `<div class="hits">These are the newest matches —
        narrow the search to reach older ones.</div>` : '')
    : (more ? `<button class="older" id="older">Showing
        ${held.length} of ${Math.max(total, held.length)} — load older messages</button>` : '');
  paintList(selectionBarHtml() + note
    + rowsHtml(rows, archived ? archivedRowHtml : m => m.__note ? noteRow(m) : messageRow(m, 'list'),
               empty, !archived, asked ? answered : '') + older);
}

// --- multi-select on the Messages list ---------------------------------------
// His ask 2026-09-24: shift-select a range of messages, ctrl/cmd-click to add
// or drop one, then one Hold (or Archive) for the whole selection in a single
// pass, rather than opening and holding each message one at a time.
function selectionBarHtml(){
  const n = state.selected.size;
  if (!n) return '';
  const dis = state.bulkBusy ? 'disabled' : '';
  const armed = state.deleteArmed === deleteTargets().join('|');
  return `<div class="selbar"><span>${n} selected</span>
    <button id="bulk-hold" ${dis}>Hold</button>
    <button id="bulk-archive" ${dis}>Archive</button>
    <button id="bulk-clear" ${dis}>Clear selection</button>
    <button id="bulk-delete" class="${armed ? 'armed' : ''}" ${dis}>${
      armed ? `Click again to delete ${n}` : 'Delete'}</button></div>`;
}

// The ordinary file-manager/mail-client convention (his report 2026-09-28:
// shift-click did not select the run in between): a plain click opens one
// row and makes it the anchor; shift-click selects every row from the
// anchor to the clicked one, in on-screen order, replacing the selection
// (ctrl/cmd+shift adds the run instead) and leaving the anchor where it was;
// ctrl/cmd-click adds or drops that one row and moves the anchor to it. The
// row open in the pane counts as selected when a multi-select starts from
// it. Not persisted: an anchor means nothing once the page reloads.
let selectAnchor = null;
// Messages and his notes on the message lists; on Action (his report
// 2026-10-06) its items too, alongside the messages it also lists.
function selectable(key){
  return /^(msg|note)\//.test(key) || (state.tab === 'waiting' && !!key);
}
function toggleMessageSelection(key, e){
  if (!state.selected.size && state.open && selectable(state.open)){
    state.selected.add(state.open);
    selectAnchor = selectAnchor || state.open;
  }
  const domKeys = [...$('#list').querySelectorAll('[data-key]')]
    .map(el => el.dataset.key).filter(selectable);
  const i = domKeys.indexOf(selectAnchor), j = domKeys.indexOf(key);
  if (e.shiftKey && i >= 0 && j >= 0){
    const [lo, hi] = i < j ? [i, j] : [j, i];
    if (!(e.ctrlKey || e.metaKey)) state.selected.clear();
    for (let k = lo; k <= hi; k++) state.selected.add(domKeys[k]);
  } else if (e.shiftKey){
    state.selected.add(key);      // no anchor on screen: the run is just this row
    selectAnchor = key;
  } else {
    if (state.selected.has(key)) state.selected.delete(key); else state.selected.add(key);
    selectAnchor = key;
  }
  renderList();
}

// --- Delete ------------------------------------------------------------------
// His ask 2026-09-28: some rows are junk - gone for good, not archived. The
// same /api/park record Archive/Hold already use, state "deleted" (the server
// then leaves the row out of every list); nothing firstmate wrote is touched.
// A message or a Waiting-on-you item can be deleted; said.jsonl, his own
// record of what he said, never is.
function deleteTargets(){
  if (state.selected.size) return [...state.selected].sort();
  const k = state.open;
  if (!k) return [];
  if (k.startsWith('msg/')) return findMessageById(k.slice(4)) ? [k] : [];
  if (k.startsWith('note/')) return openedNote() ? [k] : [];
  return (state.view.items || []).some(i => itemKey(i) === k) ? [k] : [];
}
// The rows in the order the list he is looking at shows them, so an action on
// one row moves the pane to the row beside it IN THAT LIST - the Action tab's
// mixed list (visible) or the message lists, whichever holds the key.
function orderFor(key){
  if (!/^(msg|note)\//.test(key) || state.tab === 'waiting')
    return displayOrder(visible(), false, false, rowKey);
  return displayOrder(visibleMessages().concat(listedNotes()), true, true,
    m => m.__note ? noteKey(m.__note) : msgKey(m));
}
// After an action on several rows (or one, from a bulk path) the pane moves to
// the row after the last one acted on, else the one before it, else nothing -
// the empty state - and only when the open row was among those acted on.
function moveAfterBulk(order, acted){
  if (!acted.includes(state.open)) return;
  const gone = new Set(acted);
  const left = order.filter(k => !gone.has(k));
  if (!left.length){ state.open = null; return; }
  let last = -1;
  order.forEach((k, i) => { if (gone.has(k)) last = i; });
  const next = order.slice(last + 1).find(k => !gone.has(k)) || left[left.length - 1];
  open(next);
}

// No dialog: the first click arms Delete for exactly what it would delete
// (a changed selection is a different target, so it never inherits an arm),
// and only a second click within a few seconds deletes. Every pane carries its
// own Delete beside Archive and Hold (his ask 2026-09-28: "not on every
// message"), for the one row that pane shows and never the selection; its
// armed look is kept current by renderGutter, like the gutter's own.
const deleteBtnHtml = () => state.deleteArmed === state.open
  ? '<button class="defer armed" data-delete-open>Click again to delete</button>'
  : '<button class="defer" data-delete-open>Delete</button>';
let deleteArmTimer = null;
async function armOrDelete(keys = deleteTargets()){
  if (!keys.length || state.bulkBusy) return;
  const sig = keys.join('|');
  clearTimeout(deleteArmTimer);
  if (state.deleteArmed !== sig){
    state.deleteArmed = sig;
    deleteArmTimer = setTimeout(() => { state.deleteArmed = null; renderList(); }, 4000);
    renderList();
    return;
  }
  state.deleteArmed = null;
  await deleteKeys(keys);
}
async function deleteKeys(keys){
  const order = orderFor(keys[0]);
  state.bulkBusy = true; renderList();
  let failed = 0;
  await Promise.all(keys.map(async key => {
    const [target, parkKey] = key.startsWith('msg/') ? ['message', key.slice(4)]
      : key.startsWith('note/') ? ['note', key.slice(5)] : ['item', key];
    try {
      const {ok, data} = await post('/api/park', {target, key: parkKey, state: 'deleted'});
      if (ok && data.ok) state.deleted.add(key); else failed++;
    } catch (e) { failed++; }
  }));
  state.bulkBusy = false;
  state.selected.clear();
  applyArchiveOverride();
  if (state.deleted.has(state.open)) moveAfterBulk(order, keys);
  if (failed) state.openNote = `${failed} could not be deleted - try again.`;
  render();
}

// An item in the selection is one of Action's item rows (not a message or note).
const itemOf = key => (state.view.items || []).find(i => itemKey(i) === key) || null;
async function bulkArchiveSelected(){
  const acted = [...state.selected], order = orderFor(acted[0]);
  for (const k of state.selected){
    const r = k.startsWith('note/') && findNote(k.slice(5));
    if (r && !r.archived) setNoteArchived(r, true);
    const it = k.startsWith('msg/') || k.startsWith('note/') ? null : itemOf(k);
    if (it && !isItemArchived(it)) setItemArchived(it, true);
  }
  const ms = [...state.selected].filter(k => k.startsWith('msg/'))
    .map(k => findMessageById(k.slice(4))).filter(m => m && !m.archived);
  if (!ms.length){ moveAfterBulk(order, acted); state.selected.clear(); renderList(); return; }
  state.bulkBusy = true; renderList();
  await Promise.all(ms.map(async m => {
    try {
      const {ok, data} = await post('/api/archive', {msg:m.id, archived:true});
      if (ok && data.ok) moveArchived(m, true);
    } catch (e) { /* next poll reconciles */ }
  }));
  moveAfterBulk(order, acted);
  state.selected.clear();
  state.bulkBusy = false;
  render();
}

function bulkHoldSelected(){
  const acted = [...state.selected], order = orderFor(acted[0]);
  for (const key of state.selected){
    const r = key.startsWith('note/') && findNote(key.slice(5));
    if (r && !r.held) setNoteHeld(r, true);
    if (key.startsWith('note/')) continue;
    if (!key.startsWith('msg/')){
      const it = itemOf(key);
      if (it && !isItemHeld(it)) setItemHeld(it, true);
      continue;
    }
    const m = findMessageById(key.slice(4));
    if (m && !m.held) setMsgHeld(m, true);
  }
  moveAfterBulk(order, acted);
  state.selected.clear();
  renderList();
}

// --- Work: the /bearings lavish board's four sections, in the rail itself ---
// bin/command-center-work.sh already worded these exactly as
// bin/fm-bearings-board.sh does; this only lays the rows out.
function workMetaHtml(r){
  const bits = [];
  if (r.project) bits.push(esc(r.project));
  if (r.worktree) bits.push(esc(r.worktree));
  if (r.branch) bits.push('branch ' + esc(r.branch));
  else if (r.branch_state === 'detached') bits.push('detached worktree');
  else if (r.branch_state === 'not-started') bits.push('not started');
  if (r.pr) bits.push(`<a href="${esc(r.pr)}" target="_blank" rel="noopener">${esc(r.pr)}</a>`);
  return bits.length ? `<div class="work-meta">${bits.join(' · ')}</div>` : '';
}
function workStatusHtml(id){
  const s = state.workSending[id];
  if (!s) return '';
  return `<div class="work-status">${esc(s)}</div>`;
}
// One record, one tab (his ruling 2026-09-28): a Captain's Call his board
// already carries - in Waiting on you, or archived or held from there - is
// listed and answered there, with the same box and send as every other row,
// not here a second time with an inline box of its own.
// Nor one that is already a Work row of its own (a held backlog item reads
// "Waiting on you" under its own project): only a call nothing else lists.
const workCalls = () => (state.work.captains_call || []).filter(r =>
  !boardItems().some(it => it.id === r.id && (it.key || '') === (r.key || ''))
  && !(state.work.items || []).some(it => it.id === r.id));
function workDecisionRow(r){
  const sending = state.workSending[r.id] === 'Sending…';
  return `<div class="work-row" data-work-id="${esc(r.id)}">
    <div class="work-title">${esc(r.title || r.id)}</div>
    ${workMetaHtml(r)}
    <div class="work-answer">
      <input type="text" data-work-answer="${esc(r.id)}" ${sending ? 'disabled' : ''}
             placeholder="Your answer, or the option you're choosing…">
      <button data-work-send="${esc(r.id)}" ${sending ? 'disabled' : ''}>${sending ? 'Sending…' : 'Send'}</button>
    </div>
    ${workStatusHtml(r.id)}
  </div>`;
}
// One row per piece of work asked for (/api/work's items): its one project,
// its state in plain words, and its branch and pull request when it has them.
// About the work, never the worker - that is the Agents tab.
// The second mate a row's work runs under, named only off the main home.
function underMate(r){ return r.home && r.home !== 'main' ? 'under ' + esc(r.home) : ''; }
function workItemRow(r, byState){
  const bits = [];
  if (underMate(r)) bits.push(underMate(r));
  if (r.base) bits.push('into ' + esc(r.base));
  if (r.pr) bits.push(`<a href="${esc(r.pr)}" target="_blank" rel="noopener">${esc(r.pr)}</a>`);
  return `<div class="work-row" id="work-${esc(r.id)}">
    ${labelsHtml(r)}
    <div class="work-title">${esc(r.title || r.id)}</div>
    <div class="work-sub">${linked(workStateLabel(r, new Date().toLocaleDateString('en-CA')))}</div>
    ${bits.length ? `<div class="work-meta">${bits.join(' · ')}</div>` : ''}
  </div>`;
}
function workGroupHtml(g, byState){
  const row = r => workItemRow(r, byState);
  const done = g.done.length ? `<details class="work-done" data-work-done="${esc(g.key)}"
      ${state.workDoneOpen.has(g.key) ? 'open' : ''}>
      <summary>Done (${g.done.length})</summary>${g.done.map(row).join('')}</details>` : '';
  const tally = WORK_STATE_KEYS.map(s => [g.rows.filter(r => r.state === s).length, WORK_STATE_WORDS[s]])
    .filter(([n]) => n && !byState).map(([n, w]) => `${n} ${w.toLowerCase()}`).join(' · ');
  return `<div class="worksection"><h3>${esc(g.name)} <span class="n">${g.rows.length}</span>
    <span style="text-transform:none;letter-spacing:0">${esc(tally)}</span></h3>
    ${g.rows.map(row).join('')}${done}</div>`;
}
const WORK_STATE_KEYS = ['waiting', 'building', 'queued'];
// One row per running worker or second mate (/api/work's agents, read from
// each home's state/*.meta): what it is, its project, the work it is on.
const AGENT_KINDS = { ship: 'Worker', scout: 'Scout', secondmate: 'Second mate' };
function agentRow(r){
  const kind = AGENT_KINDS[r.kind] || (r.kind ? 'Worker (' + r.kind + ')' : 'Worker');
  const on = r.item
    ? `<button class="work-link" data-goto-work="${esc(r.id)}">${esc(r.title || r.id)}</button>`
    : r.kind === 'secondmate' ? 'runs its own project’s work' : esc(r.id) + ' (no work item recorded)';
  const bits = [underMate(r), r.base ? 'into ' + esc(r.base) : '', 'running ' + esc(ageLabel(r))].filter(Boolean);
  return `<div class="work-row">
    ${labelsHtml(r)}
    <div class="work-title">${esc(kind)}</div>
    <div class="work-sub">On: ${on}</div>
    <div class="work-sub">${r.status ? linked(r.status) : 'No status line yet.'}</div>
    <div class="work-meta">${bits.join(' · ')}</div>
  </div>`;
}
function renderAgents(){
  const rows = (state.work.agents || []).filter(inProject);
  paintList(workErrorHtml() + workSectionHtml('Running now', rows, agentRow, 'No agent is running.'));
}
function prRow(r){
  const asks = prAsks(r, state.messages, state.said, state.view.items, heldMessages());
  const branch = (r.branch || 'branch not recorded') + ' → ' + (r.base || 'base not recorded');
  return `<div class="work-row">
    ${labelsHtml(r)}
    <div class="work-title">${esc(r.title || r.id)}</div>
    <div class="work-sub">${esc(branch)} · waiting ${esc(ageLabel(r))}</div>
    <div class="work-sub"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.url)}</a></div>
    ${asks.map(m => `<div class="work-sub">${para(m.text || m.title)}</div>`).join('')}
  </div>`;
}
function renderPrs(){
  const rows = state.prs.filter(inProject);
  let html = state.prsError ? `<div class="archive-note" style="background:var(--warn-soft)">
    <b>The pull requests could not be read.</b> ${esc(state.prsError)}</div>` : '';
  html += workSectionHtml('Waiting for your merge word', rows, prRow,
    'No pull request is waiting on you.');
  paintList(html);
}
async function loadPrs(){
  try {
    const res = await fetch('/api/prs');
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
