function workSectionHtml(title, rows, rowFn, emptyText){
  const body = rows.length ? rows.map(rowFn).join('')
    : `<div class="empty">${esc(emptyText)}</div>`;
  return `<div class="worksection"><h3>${esc(title)} <span class="n">${rows.length}</span></h3>${body}</div>`;
}
function workErrorHtml(){
  const w = state.work || {};
  // Only while there are no rows to show: the items below never wait on the
  // slower fleet read this error is about.
  if (w.error && !(w.items || []).length) return `<div class="archive-note" style="background:var(--warn-soft)">
    <b>The work board could not be fully read.</b> ${esc(w.error)}</div>`;
  return state.workRead ? '' : `<div class="archive-note">Reading the fleet…</div>`;
}
function renderWork(){
  const all = state.work.items || [];
  const counts = new Map();
  for (const r of all) counts.set(projectOf(r), (counts.get(projectOf(r)) || 0) + 1);
  const names = [...counts.keys()].sort((a, b) =>
    (a === NO_PROJECT) - (b === NO_PROJECT) || a.localeCompare(b));
  const chip = (value, label, n) => `<button class="work-chip" data-work-project="${esc(value)}"
    aria-pressed="${state.project === value}">${esc(label)} ${n}</button>`;
  const byState = state.workSort === 'state';
  let html = workErrorHtml();
  // The project chips are the rail's Project filter, one click each.
  html += `<div class="work-bar">${chip('', 'All projects', all.length)}${names.map(n =>
    chip(n, n === NO_PROJECT ? 'Project unknown' : n, counts.get(n))).join('')}
    <button class="work-chip" data-work-sort="${byState ? 'project' : 'state'}"
      style="margin-left:auto">Sorted by ${byState ? 'state' : 'project'} — switch</button></div>`;
  const calls = workCalls().filter(inProject);
  if (calls.length) html += workSectionHtml("Captain’s Call", calls, workDecisionRow, '');
  const groups = workGroups(all.filter(inProject), state.workSort);
  html += groups.length ? groups.map(g => workGroupHtml(g, byState)).join('')
    : `<div class="empty">${state.workRead ? 'No work is recorded.' : ''}</div>`;
  paintList(html);
}

async function loadWork(){
  try {
    const res = await fetch('/api/work');
    const body = await res.json().catch(() => ({}));
    if (!res.ok){
      state.work = Object.assign({captains_call:[],underway:[],landed:[],charted:[]},
        state.work, {error: body.error || ('HTTP ' + res.status)});
      return true;
    }
    state.work = body; state.workRead = true; return true;
  } catch (e) {
    state.work = Object.assign({captains_call:[],underway:[],landed:[],charted:[]},
      state.work, {error: String(e.message || e)});
    return true;
  }
}

async function sendWorkAnswer(id, text){
  state.workSending[id] = 'Sending…';
  renderList();
  let ok = false, data = {};
  try {
    // Exactly like every other send here: his words are recorded and queued
    // through fm-inbox.sh note, naming the task id and his chosen option, so
    // firstmate reads it as an ordinary note and acts on it - the same route
    // Waiting-on-you replies with nowhere to be delivered already take.
    ({ ok, data } = await post('/api/note', { text: id + ': ' + text }));
  } catch (err) {
    data = transportFailure('note', String(err.message || err));
  }
  if (ok && data.ok){
    state.pending[data.sid] = {key: 'work/' + id, text, at: Date.now()};
    save('cc.pending', state.pending);
    state.workSending[id] = 'Sent — going out now.';
  } else {
    state.workSending[id] = data.outcome === 'unknown'
      ? 'It may already be saved — check before sending it again. ' + (data.detail || '')
      : 'Not sent: ' + (data.error || data.detail || 'the command failed');
  }
  renderList();
  setTimeout(() => { delete state.workSending[id]; if (state.tab === 'work') renderList(); }, 6000);
}

// The rest of the log, a window at a time, oldest end of what is loaded first.
// Returns whether a window was read, so a caller can keep walking.
async function fetchOlder(archived){
  const held = archived ? state.archivedMessages : state.messages;
  const oldest = held[held.length - 1];
  if (!oldest) return false;
  try {
    const res = await fetch('/api/messages?before=' + encodeURIComponent(oldest.id)
      + (archived ? '&archived=1' : ''));
    if (!res.ok) return false;
    const body = await res.json();
    // This page was read from the oldest row the list holds, so it continues
    // that run rather than being merged against it.
    const have = new Set(held.map(m => m.id));
    const added = (body.messages || []).map(shapeMessage).filter(m => !have.has(m.id));
    const next = held.concat(added);
    if (archived) { state.archivedMessages = next; state.archivedMore = !!body.more; }
    else { state.messages = next; state.more = !!body.more; }
    if (typeof body.total === 'number') {
      if (archived) state.archivedTotal = body.total;
      else state.total = body.total;
    }
    return added.length > 0;
  } catch (e) { return false; /* the list he has still stands */ }
}
async function loadOlder(){
  if (await fetchOlder(state.tab === 'archived')) renderList();
}

// One list renderer for both, so the grouping, the flat views and the
// no-recorded-time tail cannot drift apart between them.
function rowsHtml(rows, rowFn, emptyText, isMessage, label){
  const q = label === undefined ? state.q : label;
  let head = '';
  if (q || (state.sfilter && state.tab === 'waiting'))
    head = `<div class="hits">${rows.length} match${rows.length === 1 ? '' : 'es'}${
      q ? ` for \u201c${esc(q)}\u201d` : ''}</div>`;
  if (!rows.length) return head + `<div class="empty">${emptyText}</div>`;
  if (FLAT.has(state.group)){
    const undatedCount = rows.filter(r => !r.since_epoch).length;
    // The flat list makes no ordering claim, so it owes no note about the rows
    // that could not be ordered; the two sorted views do.
    const note = (undatedCount && state.group !== 'none')
      ? `<div class="hits">${undatedCount} row${undatedCount === 1 ? '' : 's'} carry no
         recorded time and cannot be ordered — they follow at the end.</div>` : '';
    return head + note + rows.map(rowFn).join('');
  }
  let html = head;
  for (const {g, items:bucket} of groupBuckets(rows, isMessage)){
    const sub = g.g2 === undefined ? ''
      : g.none ? `<div class="g2 none">${esc(g.noneLabel)}</div>`
               : `<div class="g2">${esc(g.g2)}</div>`;
    html += `<div class="grp"><div class="g1">
      <span class="dot" style="background:${homeColour(bucket[0].home || 'main')}"></span>${esc(g.g1)}
      <span class="cnt">${bucket.length}</span></div>${sub}</div>` +
      bucket.map(rowFn).join('');
  }
  return html;
}

// His standing rule: every row names the project, the worktree and the branch.
// A field the record does not carry says so; none of the three is ever guessed.
function messageRow(m, mode){
  // One marker, the same in every tab the message is listed in: settled by
  // firstmate (the decision it asked about is closed), else the thread's own
  // "awaiting firstmate"/"answered" once he has replied.
  const named = replyTarget(m, state.view.items).item;
  const replies = repliesTo(m);
  const status = replies.length ? threadStatus(threadEntries(replies.slice().reverse())) : null;
  // A recorded answer listed on its own - only when the message it continues
  // is not held here (foldAnswers) - says what it answers (answerFor).
  const answer = answerFor(m, state.said, heldMessages());
  // Seen means seen since the newest answer folded into it (answered_by), so a
  // conversation an answer just brought back reads unread again.
  const seen = state.seen[msgKey(m)] && (!m.answered_by || state.seen['msg/' + m.answered_by]);
  return `<div class="row"><button class="item ${seen ? 'answered' : ''}${
      state.selected.has(msgKey(m)) ? ' selected' : ''}"
      data-key="${esc(msgKey(m))}" aria-current="${state.open === msgKey(m)}">
    <span class="item-top">
      <span class="item-title">${esc(m.title)}</span>
      ${state.failed[msgKey(m)] ? '<span class="flag f-stuck">not sent</span>'
        : named && named.closed ? settledFlag(named)
        : threadBadgeHtml(status)}
      <span class="age" title="from the time firstmate sent it">${ageLabel(m)}</span>
      ${recvDotHtml(latestReplyTo(m))}
    </span>
    <span class="item-sub">${labelsHtml(m)}</span>
    ${answer ? `<span class="item-sub"><span>In answer to ${answer.title
      ? `“${esc(answer.title)}”` : 'your note'}</span></span>` : ''}
  </button></div>`;
}

function noteRow(n){
  const key = noteKey(n.__note);
  const status = threadStatus(noteEntries(n));
  return `<div class="row"><button class="item ${state.seen[key] ? 'answered' : ''}${
      state.selected.has(key) ? ' selected' : ''}"
      data-key="${esc(key)}" aria-current="${state.open === key}">
    <span class="item-top">
      <span class="item-title">${esc(n.title)}</span>${threadBadgeHtml(status)}
      <span class="age" title="from the time you sent it">${ageLabel(n)}</span>
      ${recvDotHtml(n.__note)}
    </span>
    <span class="item-sub">${labelsHtml(n)}<span class="sep">·</span><span class="kind k-decision">your note</span></span>
  </button></div>`;
}

// One conversation entry, the same markup on every pane that shows a thread.
const threadEntryHtml = e => e.kind === 'you' ? `<div class="msg you">
      <div class="msg-who">You<span class="t">${esc(localTime(e.row.at))}</span>${recvDotHtml(e.row)}</div>
      <div class="msg-text">${linked(e.row.text)}</div>
      ${messageImagesHtml(e.row.images)}
      <div class="proof">${wordOutcome(e.row)}</div>
    </div>` : `<div class="msg them">
      <div class="msg-who">Firstmate<span class="t">${esc(localTime(e.row.at))}</span></div>
      <div class="msg-text">${para(e.row.text) || '<p class="quiet">No text recorded.</p>'}</div>
    </div>`;

// His replies and firstmate's answers to them, the same section on every pane.
function saidBackHtml(entries){
  const short = state.saidDropped ? `<div class="archive-note" style="background:var(--warn-soft)"><b>Your
       own words are shortened here.</b> ${state.saidDropped} older entr${
       state.saidDropped === 1 ? 'y is' : 'ies are'} not shown, so a reply you
       sent long ago may be missing from the thread below.</div>` : '';
  return short + (entries.length ? `<div class="thread"><h3>${entries.some(e => e.kind === 'firstmate')
    ? 'What you said back — and firstmate’s answer' : 'What you said back'}</h3>${
    entries.map(threadEntryHtml).join('')}</div>` : '');
}

// A decision firstmate has closed stays listed until his own Archive, so it
// says it is settled and shows the answer that settled it (closed_answer in
// command-center.py) - his report 2026-09-28: a question firstmate had already
// answered itself sat there looking like it still wanted him.
function settledFlag(it){
  return `<span class="flag f-sent">${it.answer ? 'answered by firstmate' : 'closed'}</span>`;
}
function settledHtml(it){
  if (!it || !it.closed) return '';
  const a = it.answer;
  return `<div class="thread"><h3>Firstmate has settled this</h3><div class="msg them">
      <div class="msg-who">Firstmate<span class="t">${esc(a ? a.label : 'Closed')} · ${
        esc(localTime(it.closed_at))}</span></div>
      <div class="msg-text">${a ? para(a.text)
        : '<p class="quiet">Firstmate closed this without recording an answer.</p>'}</div>
      ${a ? `<div class="proof">as recorded in ${esc(a.from)}</div>` : ''}
    </div></div>`;
}

// ONE reply box, on every pane - an item's and a message's alike, whichever
// tab it was opened from (his report 2026-09-28: "when i click send to
// firstmate why the hell it behaves differently then the messages tab?"). The
// same label, button, notes and draft handling, and the same send (sendReply).
// `going` is the one line that differs: where this record's reply goes.
function replyBoxHtml(key, going, warn){
  const draft = state.draft[key] || '';
  const verdict = SEND_VERDICT[(state.outcome[key] || {}).outcome];
  const sending = isSending(key);
  return `<div class="reply">
      ${warn || ''}
      <label for="reply">Your reply — in your own words</label>
      <textarea id="reply" placeholder="Type here…">${esc(draft)}</textarea>
      ${attachHtml(key)}
      <div class="reply-foot">
        <button class="send" id="send" ${
          draft.trim() && !state.sending && !verdict && !sending ? '' : 'disabled'}>${
          verdict ? esc(verdict.label)
                  : sending ? 'Going out now'
                  : state.sending ? 'Sending…' : 'Send to firstmate'}</button>
        ${verdict
          ? '<button class="defer" id="sendanyway">Send anyway — this may be a second copy</button>'
          : ''}
        ${draft.trim() ? '<span class="draft-flag">Draft kept</span>' : ''}
        <span class="send-note" id="sendnote">${verdict
          ? verdict.note + ' <span class="mono">' + esc(state.outcome[key].detail || '') + '</span>'
          : sending
          ? 'Written down. Going out now — the outcome appears here when the command answers.'
          : failedNote(key) || going}</span>
      </div>
    </div>`;
}
function wireReplyBox(key){
  const ta = $('#reply');
  ta.addEventListener('input', () => {
    state.draft[key] = ta.value;
    save('cc.draft', state.draft);
    $('#send').disabled = !ta.value.trim() || state.sending || isSending(key)
      || !!SEND_VERDICT[(state.outcome[key] || {}).outcome];
  });
  enterSends(ta, () => $('#send'));
  wireAttach($('.reply'), key);
}

// Enter sends a reply box, Shift+Enter a new line (and Enter while an input
// method is still composing is left alone). It only clicks that box's own Send
// button, so an empty, disabled or in-flight box sends nothing, exactly as the
// button does. Every reply and note box goes through this one function.
function enterSends(ta, sendButton){
  ta.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    e.preventDefault();
    const b = sendButton();
    if (ta.value.trim() && b && !b.disabled) b.click();
  });
}

// A note's own pane: his note, then every answer firstmate recorded against
// it, else the one matched by the moment, or plainly that none was found -
// never "not answered" as a claim, since an answer firstmate gave in ordinary
// conversation names no note. It has no reply box of its own - each answer is
// an ordinary message, opened from here and replied to there. Archive and
// Hold sit where every other pane has them.
function renderNotePane(n){
  const entries = noteEntries(n);
  const status = threadStatus(entries);
  const answers = entries.filter(e => e.kind === 'firstmate').map(e => e.row);
  const moment = entries.some(e => e.moment);
  const sid = esc(n.__note.sid);
  paintMain(noteKey(n.__note), `<div class="main-inner">
    <div class="crumbs">
      <span class="kind k-decision">you said</span>
      <span class="sep">·</span><span>${esc(localTime(n.at))}</span>
      <span class="sep">·</span>${threadBadgeHtml(status)}
    </div>
    <h2 class="subject">${esc(n.title)}</h2>
    <div class="thread">${entries.map(threadEntryHtml).join('')}</div>
    ${moment ? `<p class="quiet">Matched by the moment: the first thing firstmate said
      after this note, before you sent anything else. Firstmate did not record it as
      the answer to this note.</p>` : ''}
    ${answers.length
      ? answers.map(m => `<div class="reply-foot"><button class="defer" data-open="${
          esc(msgKey(m))}">Open firstmate’s answer to reply to it</button></div>`).join('')
      : `<p class="quiet">No answer to this has been found. Firstmate recorded none
          against it, and nothing it said in the ${NOTE_MOMENT_MINUTES} minutes after it,
          before your next message, is on this board.</p>`}
    <div class="reply-foot">
      <button class="defer" data-archive-note="${sid}">${
        n.archived ? 'Restore to Info' : 'Archive'}</button>
      ${n.held
        ? `<button class="defer" data-unhold-note="${sid}">Back to list</button>`
        : `<button class="defer" data-hold-note="${sid}">Hold</button>`}
      ${deleteBtnHtml()}
    </div>
  </div>`);
}

function trackHtml(m){
  const step = (cls, ic, label, when) =>
    `<span class="step ${cls}"><span class="ic">${ic}</span>${esc(label)}${
      when ? `<span class="when">${esc(when)}</span>` : ''}</span>`;
  const waited = m.at ? nowSecs() - Math.floor(Date.parse(m.at) / 1000) : 0;
  const stuck = !m.handled && waited >= STUCK_SECS;
  let html = step('done', '✓', 'Delivered', localTime(m.at));
  html += m.handled ? step('done', '✓', 'Picked up', '')
        : stuck     ? step('bad', '!', 'Not picked up', '')
                    : step('wait', '○', 'Not picked up yet', '');
  // An item is listed only while its decision is still OPEN, so closure cannot
  // be shown here at all; the message thread carries it (proposal sections 3, 4).
  return `<div class="track">${html}</div><div class="proof">record ${esc(m.seq)}.msg ${
    m.handled ? '→ handled/' + esc(m.seq) + '.msg — the worker acknowledged it'
              : '· still in the inbox, not in handled/'}</div>`;
}

function threadHtml(it){
  if (!(it.sent || []).length) return '';
  return `<div class="thread"><h3>What you sent</h3>` + it.sent.map(m => {
    const waited = m.at ? nowSecs() - Math.floor(Date.parse(m.at) / 1000) : 0;
    const stuck = !m.handled && waited >= STUCK_SECS;
    const mins = Math.round(waited / 60);
    return `<div class="msg you">
        <div class="msg-who">You<span class="t">${esc(localTime(m.at))}</span></div>
        <div class="msg-text">${linked(m.text)}</div>${trackHtml(m)}
      </div>` + (stuck ? `<div class="stuck-bar">
        <b>This has not been picked up for ${mins} minutes.</b>
        <div class="sub">Firstmate rings an unread message every ${GRACE_SECS} seconds and
          gives up after ${RING_MAX} tries, so it is now treated as stuck. Your message is
          safe on disk; nobody has read it.</div></div>` : '');
  }).join('') + '</div>';
}

// A message is a conversation: what firstmate said, then what he said back,
// then the box he says the next thing in. The reply goes to the same place his
// answer would have gone if he had been at the terminal - to the worker still
// waiting on that task, or to firstmate itself - and the server decides which
// from the message's own record.
function renderMessagePane(m){
  const key = msgKey(m);
  // Where it is about to go, by the rule the server routes by. He is told
  // before he sends, because a reply delivered as the answer to a question he
  // was not looking at is the worst thing this page could do.
  const target = replyTarget(m, state.view.items);
  const going = (m.question && !(state.scanned && state.confirmed))
    ? 'Where this goes cannot be told yet: the records have not been read. The server decides it from them when you send.'
    : target.kind === 'answer'
    ? `Answers <b>${esc(target.item.title)}</b> — the question this message asked, and
       nothing else.`
    : target.settled
    ? 'Nothing is waiting on that question any more, so this goes to firstmate as a note.'
    : m.source === 'transcript'
    ? 'Firstmate did not record this message as a question, so this goes to firstmate as a note — never to a worker.'
    : 'This message was not a question, so this goes to firstmate as a note — never as the answer to another decision.';
  const replies = repliesTo(m).slice().reverse();   // the log is newest first
  const entries = threadEntries(replies);
  const status = threadStatus(entries);
  const cell = (label, value, na) =>
    `<div><dt>${label}</dt><dd>${value ? esc(value) : `<span class="lbl-miss">${esc(na)}</span>`}</dd></div>`;
  // A message firstmate recorded as the answer to something he sent
  // (answerFor) shows that first: the message he replied to, when the page
  // holds it (archived or not), then his query, then this answer.
  const answer = answerFor(m, state.said, heldMessages());
  paintMain(key, `<div class="main-inner">
    <div class="crumbs">
      <span class="kind k-decision">firstmate said</span>
      <span class="sep">·</span><span>${esc(localTime(m.at))}</span>
      ${status ? `<span class="sep">·</span>${threadBadgeHtml(status)}` : ''}
    </div>
    <h2 class="subject">${esc(m.title)}</h2>
    <div class="where">
      ${cell('Project', knownValue(m.project), 'project not recorded')}
      ${cell('Worktree', shortPath(knownValue(m.worktree)), 'worktree not recorded')}
      ${cell('Branch', knownValue(m.branch), 'branch not recorded')}
    </div>
    ${m.project_by ? `<div class="quiet">Project read from the message by Jev${
      esc(recordedProject(m))}</div>` : ''}
    ${m.context_source ? `<div class="quiet">${esc(m.context_source)}</div>` : ''}
    ${answer ? `<div class="thread"><h3>In answer to what you said${answer.title
      ? ` about “${esc(answer.title)}”` : ''}</h3>${
      answer.original ? threadEntryHtml({kind: 'firstmate', row: answer.original}) : ''}${
      threadEntryHtml({kind: 'you', row: answer.send})}</div>` : ''}
    <div class="msg them">
      <div class="msg-who">Firstmate<span class="t">${esc(localTime(m.at))}</span></div>
      <div class="msg-text">${para(m.text) || '<p class="quiet">No text recorded.</p>'}</div>
    </div>
    ${target.settled ? settledHtml(target.item) : ''}
    ${saidBackHtml(entries)}
    ${replyBoxHtml(key, going)}
    <div class="reply-foot">
      <button class="defer ${archiveRecvClass(latestReplyTo(m))}" data-archive-msg="${esc(m.id)}" ${state.archiving === m.id ? 'disabled' : ''}>${
        m.archived ? 'Restore to Info' : state.archiving === m.id ? 'Archiving…' : 'Archive'}</button>
      ${isMsgHeld(m)
        ? `<button class="defer" data-unhold-msg="${esc(m.id)}">Back to list</button>`
        : `<button class="defer" data-hold-msg="${esc(m.id)}">Hold</button>`}
      ${deleteBtnHtml()}
    </div>
  </div>`);
  wireReplyBox(key);
}

function renderMain(){
  if (String(state.open || '').startsWith('note/')){
    const n = openedNote();
    if (n){ renderNotePane(n); return; }
  }
  if (String(state.open || '').startsWith('msg/')){
    const m = openedMessage();
    if (m){ renderMessagePane(m); return; }
    // He clicked a message the page does not hold - his own reply to one, far
    // behind the window. It is being read out of the log; say so rather than
    // showing him the blank pane over a message that exists.
    paintMain(state.open, `<div class="blank"><strong>${esc(state.openNote
      || 'Opening that message…')}</strong></div>`);
    return;
  }
  const it = (state.view.items || []).find(i => itemKey(i) === state.open);
  if (!it){
    paintMain('', `<div class="blank"><strong>Pick something on the left.</strong>
      <span>Everything firstmate has said to you, newest first, with a box to reply in.<br>
      <b>Action</b> is only what needs your answer or decision; <b>PRs</b> is what waits for your merge word.<br>
      <b>Ignore</b> keeps the repeats and nothing-new notes, so you can check nothing important was dropped.<br>
      New things appear on their own — you never reload, and you never get a new link.</span></div>`);
    return;
  }
  const L = LISTEN[it.listen] || LISTEN.unknown;
  const detail = para(it.detail);
  // What he has said here, oldest first, interleaved with firstmate's answers
  // - the same thread, built the same way, as a message's own pane.
  const answered = saidOnItem(state.said, itemKey(it)).slice().reverse();
  const answerEntries = threadEntries(answered);
  const answerStatus = threadStatus(answerEntries);
  // Every answer now reaches firstmate's captain inbox (deliver_to_inbox in
  // command-center.py), whatever the item is.
  const going = it.closed
    ? 'Firstmate has already settled this, so this reaches it as a note about it.'
    : 'Goes to firstmate as your answer to this decision, and nothing else.';
  const cell = (label, value, na) =>
    `<div><dt>${label}</dt><dd>${value ? esc(value) : `<span class="lbl-miss">${esc(na)}</span>`}</dd></div>`;
  const deadWarn = it.listen === 'dead' ? `<div class="dead-warn">
      <b>Nobody is listening to this one right now.</b> Your answer is written down and will
      not be lost, but it sits unread until firstmate restarts the worker.</div>` : '';

  paintMain(itemKey(it), `<div class="main-inner">
    <div class="crumbs">
      <span class="src"><span class="dot" style="background:${homeColour(it.home)}"></span>${esc(homeOf(it.home).name)}</span>
      <span class="sep">·</span><span class="kind k-${it.source === 'hold' ? 'decision' : 'blocker'}">${it.source === 'hold' ? 'decision' : esc(it.status_verb || 'blocked')}</span>
      <span class="sep">·</span><span title="${esc(ageTitle(it))}">waiting ${ageLabel(it)}</span>
      ${it.deferred_until ? `<span class="sep">·</span><span>deferred to ${esc(it.deferred_until)}</span>` : ''}
      ${answerStatus ? `<span class="sep">·</span>${threadBadgeHtml(answerStatus)}` : ''}
    </div>
    <h2 class="subject">${esc(it.title)}</h2>
    <div class="listen ${esc(it.listen)}"><span class="lamp ${esc(it.listen)}"></span>
      <span><b>${esc(L.label)}.</b> ${esc(L.say)}</span></div>
    <div class="where">
      ${cell('Project', knownValue(it.project), 'project not recorded')}
      ${cell('Worktree', shortPath(knownValue(it.worktree)), 'worktree not recorded')}
      ${cell('Branch', knownValue(it.branch), 'branch not recorded')}
    </div>
    <div class="msg them">
      <div class="msg-who">Firstmate<span class="t">${esc(ageTitle(it))}</span></div>
      <div class="msg-text">${detail || '<p class="quiet">No detail recorded.</p>'}</div>
    </div>
    ${settledHtml(it)}
    ${saidBackHtml(answerEntries)}
    ${threadHtml(it)}
    ${replyBoxHtml(itemKey(it), going, deadWarn)}
    <div class="reply-foot">
      <button class="defer ${archiveRecvClass(latestAnswerFor(it))}" data-archive-item="${esc(itemKey(it))}">${
        isItemArchived(it) ? 'Restore' : 'Archive'}</button>
      ${isItemHeld(it)
        ? `<button class="defer" data-unhold-item="${esc(itemKey(it))}">Back to list</button>`
        : `<button class="defer" data-hold-item="${esc(itemKey(it))}">Hold</button>`}
      ${deleteBtnHtml()}
    </div>
  </div>`);

  wireReplyBox(itemKey(it));
}

// ONE OWNER OF THE PANE'S HTML. Whatever rebuilds it, his place survives: the
// pane's scroll offset, and the box with its text (from cc.draft), its focus
// and its caret. So no caller ever has to choose between showing him the truth
// and letting him read or type - which is the choice that took his cursor on
// one path and left the pane stale on another. #main is the scroll container
// (.main{overflow-y:auto}), and assigning its innerHTML drops that offset to
// the top, which mid-sentence is the page moving under him.
//
// Keeping his place means keeping his place in the thing he is READING, so what
// is being painted is named rather than inferred: the same pane again restores
// where he was, and anything else opens at its own top - clicking a message to
// read it is what this page is for, and it may never open with its title
// scrolled off screen.
let painted = null;
function paintMain(key, html){
  const pane = $('#main');
  const same = key === painted;
  const where = pane.scrollTop;
  const box = $('#reply');
  const typing = box && document.activeElement === box
    ? {start: box.selectionStart, end: box.selectionEnd, scroll: box.scrollTop}
    : null;
  pane.innerHTML = html;
  painted = key;
  pane.scrollTop = same ? where : 0;
  const next = $('#reply');
  if (!same || !typing || !next) return;
  next.focus({preventScroll: true});
  next.setSelectionRange(typing.start, typing.end);
  next.scrollTop = typing.scroll;
  // Restored to where he was, the caret can still be off screen if the rebuild
  // changed the pane's height, and typing where he cannot see is the same
  // complaint by another name.
  const seen = next.getBoundingClientRect();
  const view = pane.getBoundingClientRect();
  if (seen.bottom > view.bottom || seen.top < view.top)
    next.scrollIntoView({block: 'nearest'});
}

function render(){
  renderList(); renderMain();
  // The note box hangs off no item, so its button is the surface its outcome
  // lands on. A transient message it is showing right now is left alone.
  if (Date.now() > (state.noteFlash || 0))
    $('#open-note').textContent = noteButtonLabel();
}

// After an Archive or Hold click removes the currently open row from its own
// list, the pane moves on: the next key in that same pre-removal order, the
// previous one if it was the last, or nothing if the list is now empty.
function advanceTo(orderedKeys, removedKey){
  const i = orderedKeys.indexOf(removedKey);
  const rest = orderedKeys.filter(k => k !== removedKey);
  // i < 0: the row was open from a different list than the one walked (e.g. a
  // message held from Waiting on you) - close the pane rather than open rest[-1].
  if (!rest.length || i < 0){ state.open = null; render(); return; }
  open(rest[Math.min(i, rest.length - 1)]);
}

function open(key){
  state.open = key;
  // A message found in the log is held here for as long as it is open, so the
  // pane he is reading - and the reply he is typing into it - survive the
  // search that found it being cleared or typed past.
  const isMsg = String(key).startsWith('msg/');
  state.openMsg = isMsg ? openedMessage() : null;
  state.openNote = '';
  state.seen[key] = true;
  // Opening a conversation reads the answers folded into it too (foldAnswers).
  if (state.openMsg) for (const e of threadEntries(repliesTo(state.openMsg)))
    if (e.kind === 'firstmate') state.seen[msgKey(e.row)] = true;
  save('cc.seen', state.seen);
  render();
  if (isMsg && !state.openMsg) fetchMessage(key.slice(4));
}

// The log holds every message, so anything he can click on is readable - the
// page just may not have it loaded.
async function fetchMessage(id){
  const key = 'msg/' + id;
  try {
    const res = await fetch('/api/messages?id=' + encodeURIComponent(id));
    if (!res.ok) throw new Error('the server answered ' + res.status);
    const body = await res.json();
    if (state.open !== key) return;              // he has moved on
    const m = (body.messages || [])[0];
    if (m) state.openMsg = shapeMessage(m);
    else state.openNote = body.error
      ? 'That message could not be read: ' + body.error
      : 'That message is not in the record any more.';
  } catch (e) {
    if (state.open !== key) return;
    state.openNote = 'That message could not be read: ' + (e.message || e);
  }
  render();
}

function moveArchived(m, archived){
  m.archived = archived;
  m.archived_at = archived ? nowIso() : null;
  state.archiveOverride[m.id] = { archived, at: nowIso() };
  state.messages = state.messages.filter(x => x.id !== m.id);
  state.archivedMessages = state.archivedMessages.filter(x => x.id !== m.id);
  if (archived) {
    state.archivedMessages.unshift(m);
    state.total = Math.max(0, state.total - 1);
    state.archivedTotal++;
  } else {
    state.messages.unshift(m);
    state.total++;
    state.archivedTotal = Math.max(0, state.archivedTotal - 1);
  }
}

// A poll already in flight when he clicked Archive/Restore can still resolve
// afterward with an answer read from just before that write landed - the one
// case bin/command-center.py's own etag cannot rule out, since it only bumps
// once the write is actually on disk. Once his own click is the last word on
// an id, no poll's answer may contradict it until the opposite click does.
function applyArchiveOverride(){
  if (state.deleted.size){
    const keep = rows => (rows || []).filter(m => !state.deleted.has(msgKey(m)));
    state.messages = keep(state.messages);
    state.archivedMessages = keep(state.archivedMessages);
    if (state.found) state.found.rows = keep(state.found.rows);
    if (state.archivedFound) state.archivedFound.rows = keep(state.archivedFound.rows);
    state.view.items = (state.view.items || []).filter(it => !state.deleted.has(itemKey(it)));
  }
  for (const [id, { archived, at }] of Object.entries(state.archiveOverride)){
    if (archived){
      const i = state.messages.findIndex(x => x.id === id);
      // An answer that arrived after his Archive restored it (the server's
      // restore_answered): that is newer than his click, so it stands.
      if (i >= 0 && state.messages[i].restored_at > at){ delete state.archiveOverride[id]; continue; }
      if (i >= 0){
        const [m] = state.messages.splice(i, 1);
        m.archived = true;
        if (!state.archivedMessages.some(x => x.id === id)) state.archivedMessages.unshift(m);
      }
    } else {
      const i = state.archivedMessages.findIndex(x => x.id === id);
      if (i >= 0){
        const [m] = state.archivedMessages.splice(i, 1);
        m.archived = false;
        if (!state.messages.some(x => x.id === id)) state.messages.unshift(m);
      }
    }
  }
}

function findMessageById(id){
  const find = rows => (rows || []).find(x => x.id === id);
  return find(state.messages) || find(state.archivedMessages)
    || find(state.found && state.found.rows) || find(state.archivedFound && state.archivedFound.rows)
    || (state.openMsg && state.openMsg.id === id ? state.openMsg : null);
}

// `advance` is true only from a row's own Archive button or the pane's -
// never from a plain state refresh - so the pane moves on to the next
// message in whichever list it was archived out of.
async function archiveMessageById(id, advance){
  const m = id && findMessageById(id);
  if (!m || state.archiving) return;
  const archived = !m.archived;
  const keys = advance && archived ? orderFor(msgKey(m)) : null;
  state.archiving = m.id;
  render();
  try {
    const {ok, data} = await post('/api/archive', {msg:m.id, archived});
    if (!ok || !data.ok) throw new Error(data.error || 'the archive record could not be written');
    moveArchived(m, archived);
    if (keys && state.open === msgKey(m)){ state.archiving = null; advanceTo(keys, msgKey(m)); return; }
  } catch (e) {
    state.openNote = 'The archive change did not land: ' + (e.message || e);
  } finally {
    state.archiving = null;
  }
  render();
}

// --- talking to the server ---------------------------------------------------
// A read that resolved well answers every reachability question at once, so
// they are all cleared here rather than at each branch's discretion - the
// per-branch enumeration is what kept leaving one alarm standing.
// The rules live in bin/command-center-state.js; this applies what they decide
// and moves the one piece of them that is a pixel rather than a fact.
function commit(answer){
  const before = state.connected;
  Object.assign(state, pollFacts(answer, nowSecs()));
  if (state.connected !== before)
    $('#live').innerHTML = state.connected
      ? '<span class="beat"></span>Live'
      : '<span class="lamp dead"></span>Not connected';
}

async function poll(){
  // A poll being IN FLIGHT says nothing about the view on screen: the last poll
  // confirmed it, and only a RESOLVED outcome may take that back. So the verdict
  // is committed when the answer arrives, never optimistically on the way out.
  try {
    const res = await fetch('/api/items', {
      headers: state.etag ? {'If-None-Match': state.etag} : {} });
    reloadIfStale(res);
    if (res.status === 503){
      commit({ kind:'unread',
               detail: (await res.json().catch(() => ({}))).error
                 || 'the records have not been read yet' });
      render();
      return;
    }
    if (!res.ok && res.status !== 304) throw new Error('HTTP ' + res.status);
    if (res.status === 304){
      commit({ kind:'unchanged' });
      renderWatcher();
      return;
    }
    state.etag = res.headers.get('ETag');
    const next = await res.json();
    const before = new Set((state.view.items || []).map(itemKey));
    const arrived = (next.items || []).map(itemKey).filter(k => !before.has(k));
    commit({ kind:'body', error: next.error || null });
    state.view = next;
    applyArchiveOverride();
    state.scanned = true;
    state.outcome = releaseVerdicts(state.outcome, next);
    save('cc.outcome', state.outcome);
    if (before.size && arrived.length === 1) state.flash = arrived[0];
    render();
    if (state.flash) setTimeout(() => { state.flash = null; renderList(); }, 2000);
  } catch (err) {
    commit({ kind:'unreachable', detail: String(err.message || err) });
    renderWatcher();
  }
}

// The message log is read on its own, not through /api/items: what firstmate
// said to him is still readable when the scan of the work records is not, and
// the page must not go blank about it because a backlog could not be parsed.
async function loadMessages(){
  try {
    // The log is append-only and the capture's health travels in the same tag,
    // so an unchanged poll costs neither side a re-read of the whole log.
    const res = await fetch('/api/messages', {
      headers: state.msgEtag ? {'If-None-Match': state.msgEtag} : {} });
    if (res.status === 304){ state.msgRead = true; return false; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    state.msgEtag = res.headers.get('ETag');
    const body = await res.json();
    const before = listSignature(state.messages) + '/' + state.msgError
      + '/' + JSON.stringify(captureBand(state.capture, captureContext()));
    // Only the newest window is polled, so it is merged into what the page
    // already holds rather than replacing it: a row that has fallen out of the
    // window since it was read is still one of the things firstmate said.
    const fresh = (body.messages || []).map(shapeMessage);
    state.messages = mergeMessages(fresh, state.messages);
    // A message the server now serves as current is not archived, whatever
    // the page last read: an answer brought it back (restore_answered).
    const current = new Set(fresh.map(m => m.id));
    state.archivedMessages = state.archivedMessages.filter(m => !current.has(m.id));
    state.more = state.messages.length > fresh.length ? state.more : !!body.more;
    // Waiting on you is built from these rows (waitingMessageRows), so the
    // newest window alone would silently drop every question older than it
    // (his report 2026-09-28: "they just disappeared"). Every unarchived
    // message is walked in before anything renders, however many newer ones
    // arrived or whatever mergeMessages had to drop; if a window cannot be
    // read, state.more stays set and Waiting on you says it is incomplete.
    // ponytail: pages the whole unarchived log (bounded by what he has not
    // archived); move the question rule server-side if that ever runs to
    // thousands.
    while (state.more && await fetchOlder(false)) { /* next window */ }
    applyArchiveOverride();
    state.total = typeof body.total === 'number' ? body.total : state.messages.length;
    state.archivedTotal = typeof body.archived_total === 'number'
      ? body.archived_total : state.archivedTotal;
    state.msgError = body.error || null;
    state.capture = body.capture || null;
    state.msgRead = true;
    return before !== listSignature(state.messages) + '/' + state.msgError
      + '/' + JSON.stringify(captureBand(state.capture, captureContext()));
  } catch (e) {
    // Reachability already has its own band from the item poll; this only
    // declines to claim the list is complete.
    return false;
  }
}

async function loadArchivedMessages(){
  try {
    const res = await fetch('/api/messages?archived=1');
    if (!res.ok) return false;
    const body = await res.json();
    const fresh = (body.messages || []).map(shapeMessage);
    state.archivedMessages = mergeMessages(fresh, state.archivedMessages);
    applyArchiveOverride();
    state.archivedMore = state.archivedMessages.length > fresh.length
      ? state.archivedMore : !!body.more;
    state.archivedTotal = typeof body.total === 'number' ? body.total : state.archivedMessages.length;
    return true;
  } catch (e) { return false; }
}

// Returns {read, changed}: whether this poll actually read the record, and
// whether what it holds moved. They are different facts - a read that threw
// leaves the page holding an old list, which nothing may be decided on - and
// collapsing them into one boolean is what let a real delivery be buried.
async function loadSaid(){
  try {
    const res = await fetch('/api/said', {
      headers: state.saidEtag ? {'If-None-Match': state.saidEtag} : {} });
    if (res.status === 304) return {read: true, changed: false};
    if (!res.ok) return {read: false, changed: false};
    state.saidEtag = res.headers.get('ETag');
    // logRead and foldSaid come from bin/command-center-state.js: what counts
    // as a read, and the outcome row superseding the acceptance row.
    const got = logRead(await res.json(), 'said');
    if (!got.read){
      const was = state.saidError;
      state.saidError = got.error;
      return {read: false, changed: was !== got.error};
    }
    const rows = foldSaid(got.rows);
    // A log that does not exist yet is served with no change check, so every
    // poll is a fresh 200: what CHANGED has to be decided here, or the pane
    // would be rebuilt every three seconds and take his cursor out of a reply.
    // saidDigest, not the list's head: delivery finishes behind the send, so an
    // outcome can land on ANY row - a second send while the first is still
    // going out pushes the first one down the list.
    const before = saidDigest(state.said) + '/' + state.saidError + '/' + state.saidDropped;
    state.said = rows;
    state.saidError = null;
    state.saidDropped = got.dropped;
    applyOutcomes();
    return {read: true,
            changed: before !== saidDigest(rows) + '/' + state.saidError
                     + '/' + state.saidDropped};
  } catch (e) { return {read: false, changed: false}; }   // the list still works without it
}

// The outcome of a send now arrives in the record rather than in the answer to
// the click, so the do-not-resend verdict is set from the record. Each send is
// judged once: after he has said to send it anyway, the same row must not lock
// it again on the next poll.
function applyOutcomes(){
  let changed = false;
  for (const r of state.said){
    if (!r.sid || r.outcome === 'sending' || state.applied[r.sid]) continue;
    state.applied[r.sid] = true;
    changed = true;
    const held = state.pending[r.sid];
    if (held){
      delete state.pending[r.sid];
      // wordsAfter and sendKeys come from bin/command-center-state.js: what an
      // arrived outcome does to the words it is about, and every surface it is
      // said on. `leave` is the box holding something he has typed since.
      const surfaces = sendKeys(held.key, held.item);
      const inBox = held.key === 'note' ? state.note : state.draft[held.key];
      const fate = wordsAfter(r, inBox, held.text);
      switch (fate){
        case 'clear':
          // It landed, and only now may those words leave the box.
          if (held.key === 'note') noteText('');
          else delete state.draft[held.key];
          break;
        case 'restore':
          // It did not land, so his words go back where he typed them.
          if (held.key === 'note') noteText(held.text);
          else state.draft[held.key] = held.text;
          break;
      }
      // What became of the send is about the send, not about the box, so it is
      // said on every surface either way - and no surface goes on warning
      // about a delivery the record has since confirmed. `kept` is where the
      // words themselves are now, because on the `leave` branch the box holds
      // something he typed since and only the record still has what he sent.
      // `kept` is a fact about the box the READER is looking at, and only the
      // surface he typed in has a box holding those words: for a reply that
      // steered an item, that item's own box never held them, so there the only
      // copy really is the record.
      for (const k of surfaces){
        if (r.outcome === 'sent') delete state.failed[k];
        else state.failed[k] = {outcome: r.outcome, detail: r.detail || '',
                                kept: k === held.key && fate !== 'leave'
                                  ? 'box' : 'record'};
      }
      save('cc.draft', state.draft);
      save('cc.pending', state.pending);
      save('cc.failed', state.failed);
    }
    // A reply to a recorded question carries BOTH: the message he answered
    // from and the item it steered. An unconfirmed delivery forbids a second
    // one from either surface, so the verdict is held against both.
    const keys = sendKeys(r.msg ? 'msg/' + r.msg : '', r.item_key);
    if (!keys.length) continue;
    const verdict = verdictFor(r.source || 'status', r.outcome, r.detail,
                               r.sent_count || 0);
    if (verdict) for (const k of keys) state.outcome[k] = verdict;
  }
  if (changed){ save('cc.applied', state.applied); save('cc.outcome', state.outcome); }
}

// The note box is a dialog that is built once, so its element is the box: a
// note whose outcome arrives later has to reach the textarea itself, or a
// delivered note sits there waiting to be sent a second time - and queue_note
// mints a fresh id, so that would be a genuine duplicate.
function noteText(text){
  state.note = text;
  save('cc.note', state.note);
  const box = $('#note-text');
  if (box) box.value = text;
}

// His words stay in the box until the outcome says they landed, so the button
// they were sent from has to say they are already going out: otherwise a second
// click on the same box is a second answer to the same decision.
function isSending(key){
  // A reply delivered on the answer route is a steer at an ITEM, so it is in
  // flight on both surfaces: the message he typed it in and the row it steers.
  return Object.values(state.pending)
    .some(p => !p.released && (p.key === key || p.item === key));
}

// A send the page can never hear the end of. The server answers the click
// before the command runs, so a process killed under the delivery thread
// (a restart, a reboot, a SIGTERM inside the send window) leaves an acceptance
// row with no outcome row after it. Past the window that is not a send in
// flight any more: it is a send nobody can confirm, so the page says exactly
// that, puts his words back, and lets him send again. It recovers by itself -
// a box he can never type in again is the freeze that started this by another
// road.
const SEND_WINDOW_MS = 150000;   // bin/command-center.py SEND_TIMEOUT plus slack

// mayRelease comes from bin/command-center-state.js and owns the decision.
// The record of the send is KEPT, marked released: an outcome row that turns up
// late still reaches applyOutcomes, which supersedes what was said here - takes
// his words back out of the box if it landed after all, or re-states the real
// failure if it did not.
function reconcilePending(read){
  let changed = false;
  for (const [sid, held] of Object.entries(state.pending)){
    if (!mayRelease(read, held, state.said.find(r => r.sid === sid),
                    Date.now(), SEND_WINDOW_MS)) continue;
    state.pending[sid] = Object.assign({}, held, {released: true});
    // His words are put back only into a box that no longer holds any of his:
    // whatever is in there now is his, and newer than what was sent. sameWords
    // comes from bin/command-center-state.js and answers both questions.
    const inBox = held.key === 'note' ? state.note : state.draft[held.key];
    const empty = sameWords(inBox, '');
    if (empty){
      if (held.key === 'note') noteText(held.text);
      else state.draft[held.key] = held.text;
    }
    // A reply that took the answer route was a steer at an ITEM as well, and
    // the warning has to stand on both surfaces: otherwise the waiting list
    // offers Send with nothing said, and the same worker is steered twice.
    const detail = 'nothing ever reported what became of it: the page or the '
                 + 'server stopped before the command answered';
    const inHisBox = empty || sameWords(inBox, held.text);
    for (const k of sendKeys(held.key, held.item))
      state.failed[k] = {outcome: 'unknown', detail: detail,
                         kept: k === held.key && inHisBox ? 'box' : 'record'};
    changed = true;
  }
  if (changed){
    save('cc.pending', state.pending);
    save('cc.draft', state.draft);
    save('cc.failed', state.failed);
  }
  return changed;
}

// One owner of "this send did not land", so the item pane, the reply pane and
// the note box all say the same thing about it.
function failedNote(key){
  const f = state.failed[key];
  if (!f) return '';
  // Where the words are is a fact about this box, not about the send, so it is
  // said as it is: still here, or kept in the record because the box has
  // moved on to something he typed since.
  const where = f.kept === 'record'
    ? 'What you sent is kept in the record.'
    : 'Your words are still here.';
  return f.outcome === 'unknown'
    ? `<b>Delivery could not be confirmed.</b> ${esc(f.detail || '')} — it may already have
       arrived, so check before sending it again. ${where}`
    : `<b style="color:var(--hot)">Not sent.</b> ${esc(f.detail || 'the command failed')}
       — ${where}`;
}

async function post(url, body){
  writing++;
  try {
    const res = await fetch(url, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body) });
    return { ok: res.ok, data: await res.json().catch(() => ({})) };
  } finally { writing--; }
}

// --- pasted/dropped reply images ---------------------------------------------
// Mirrors the server's own list/cap (command-center.py IMAGE_MIME_EXT/
// MAX_IMAGE_BYTES/MAX_IMAGES) so a bad file is refused before it is even
// uploaded; the server enforces the same limits regardless, this is just
// so he isn't left waiting on a request that was always going to fail.
const IMAGE_TYPES = ['image/png', 'image/jpeg', 'image/gif', 'image/webp'];
const MAX_IMAGE_BYTES = 8 * 1024 * 1024;
const MAX_IMAGES = 6;

function imageStripHtml(key){
  const items = state.images[key] || [];
  const err = state.imageErr[key];
  if (!items.length && !err) return '';
  const thumbs = items.map(im => `<div class="attach-thumb">
      <img src="/image/${esc(im.id)}" alt="">
      <button type="button" class="rm" data-rm-image="${esc(im.id)}" data-image-key="${esc(key)}"
        aria-label="Remove image">✕</button>
    </div>`).join('');
  return `<div class="attach-strip">${thumbs}</div>${
    err ? `<div class="attach-err">${esc(err)}</div>` : ''}`;
}

function messageImagesHtml(images){
  if (!images || !images.length) return '';
  return `<div class="msg-images">${images.map(id =>
    `<a href="/image/${esc(id)}" target="_blank" rel="noopener"><img src="/image/${esc(id)}" alt=""></a>`
  ).join('')}</div>`;
}

async function uploadImage(key, file){
  if (!IMAGE_TYPES.includes(file.type)){
    state.imageErr[key] = 'Only PNG, JPEG, GIF or WEBP images are accepted.';
    renderAttachStrip(key);
    return;
  }
  if (file.size > MAX_IMAGE_BYTES){
    state.imageErr[key] = `Too big: the limit is ${MAX_IMAGE_BYTES / (1<<20)} MB per image.`;
    renderAttachStrip(key);
    return;
  }
  if ((state.images[key] || []).length >= MAX_IMAGES){
    state.imageErr[key] = `Up to ${MAX_IMAGES} images per reply.`;
    renderAttachStrip(key);
    return;
  }
  delete state.imageErr[key];
  let res, data;
  writing++;
  try {
    res = await fetch('/api/upload', {
      method: 'POST', headers: {'Content-Type': file.type}, body: file });
    data = await res.json().catch(() => ({}));
  } catch (err) {
    state.imageErr[key] = 'The image could not be uploaded — try again.';
    renderAttachStrip(key);
    return;
  } finally { writing--; }
  if (!res.ok || !data.ok){
    state.imageErr[key] = data.error || 'The image could not be uploaded.';
    renderAttachStrip(key);
    return;
  }
  state.images[key] = (state.images[key] || []).concat([{id: data.id, name: file.name || ''}]);
  save('cc.images', state.images);
  renderAttachStrip(key);
}

async function attachFiles(key, files){
  for (const file of Array.from(files || [])) await uploadImage(key, file);
}

// A repaint over the poll cadence would drop focus/caret the same way a
// draft keystroke would; the strip is a small DOM patch instead, keyed by
// whichever box owns it (id="attach-strip-<key-slot>").
function renderAttachStrip(key){
  const slot = document.querySelector(`[data-attach-strip="${cssEsc(key)}"]`);
  if (slot) slot.outerHTML = `<div data-attach-strip="${esc(key)}">${imageStripHtml(key)}</div>`;
}
function cssEsc(s){ return String(s).replace(/["\\]/g, '\\$&'); }

function wireAttach(container, key){
  const input = container.querySelector('[data-attach-input]');
  const btn = container.querySelector('[data-attach-btn]');
  const box = container.querySelector('textarea');
  if (btn && input) btn.addEventListener('click', () => input.click());
  if (input) input.addEventListener('change', async () => {
    await attachFiles(key, input.files);
    input.value = '';
  });
  if (box) box.addEventListener('paste', async e => {
    const files = Array.from(e.clipboardData?.items || [])
      .filter(i => i.kind === 'file' && i.type.startsWith('image/'))
      .map(i => i.getAsFile()).filter(Boolean);
    if (files.length) await attachFiles(key, files);
  });
  container.addEventListener('dragover', e => { e.preventDefault(); });
  container.addEventListener('drop', async e => {
    e.preventDefault();
    const files = Array.from(e.dataTransfer?.files || []).filter(f => f.type.startsWith('image/'));
    if (files.length) await attachFiles(key, files);
  });
  container.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm-image]');
    if (!rm) return;
    const id = rm.dataset.rmImage;
    state.images[key] = (state.images[key] || []).filter(im => im.id !== id);
    save('cc.images', state.images);
    renderAttachStrip(key);
  });
}

function attachHtml(key){
  return `<div class="reply-foot">
      <button type="button" class="attach-btn" data-attach-btn>📎 Attach image</button>
      <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple
        data-attach-input style="display:none">
    </div>
    <div data-attach-strip="${esc(key)}">${imageStripHtml(key)}</div>`;
}

// The ONE send behind every reply box (replyBoxHtml), an item's answer and a
// message's reply alike. The click never waits on a shell command: the server
// writes his words to the durable record and answers 202 before it runs
// anything, and the outcome appears on the row he answered when the command
// answers (applyOutcomes). Only the endpoint differs - the server decides from
// the record where the words go. The pane STAYS on the row he answered: it
// used to jump to the next item after an item's answer (but not a message's),
// so his very next click - Archive - landed on a row he had never opened (his
// report 2026-09-28: "i replied oone. and then the second one disappeard").
async function sendReply(){
  const key = state.open;
  const m = String(key || '').startsWith('msg/') ? openedMessage() : null;
  const it = m ? null : (state.view.items || []).find(i => itemKey(i) === key);
  if (!m && !it) return;
  const text = (state.draft[key] || '').trim();
  if (!text || state.sending || isSending(key)) return;
  const images = (state.images[key] || []).map(im => im.id);
  state.sending = true; renderMain();
  let ok = false, data = {};
  try {
    ({ ok, data } = m
      ? await post('/api/reply', { msg: m.id, text, images })
      : await post('/api/answer', { home: it.home, id: it.id, source: it.source,
                                    key: it.key || '', text, images }));
  } catch (err) {
    // The request never came back. Every send only ever reaches firstmate's
    // captain inbox, so the worst case is a second note, never a second steer
    // landing on a worker - safe to just say it failed and let him try again.
    data = transportFailure(it ? it.source : 'status', String(err.message || err));
  } finally {
    state.sending = false;
  }
  if (ok && data.ok){
    // Accepted, not delivered: his words stay in the box until the outcome row
    // says the send landed. A reply that took a message's answer route names
    // the item it answers too, so the send shows on that row as well.
    state.pending[data.sid] = {key, item: data.item_key || null, text, at: Date.now()};
    delete state.failed[key];
    delete state.images[key];
    // A reply never archives or removes anything on its own - only his own
    // explicit Archive, Hold or Delete does.
    save('cc.pending', state.pending); save('cc.failed', state.failed); save('cc.images', state.images);
    await loadSaid();
    render();
    const sent = $('#sendnote');
    if (sent) sent.innerHTML = `Written down and going out now. The outcome appears under
      <b>What you said back</b> when the command answers.`;
    return;
  }
  await loadSaid();
  render();
  const note = $('#sendnote');
  if (note) note.innerHTML = `<b style="color:var(--hot)">Not sent.</b> ${
    esc(data.error || data.detail || 'the command failed')} — your words are still here.`;
}

// --- events ------------------------------------------------------------------
// Shift-click on a row extends the row selection, not the browser's own text
// selection across the list.
document.addEventListener('mousedown', e => {
  if (e.shiftKey && e.target.closest('#list .item')) e.preventDefault();
});
document.addEventListener('click', async e => {
  // A real link (linkify's own <a target=_blank>, e.g. a URL inside a row's
  // own button) must act like a real link and nothing else. His
  // report: "why every link i click fucking opens two tabs" - a linked row
  // (a link inside the row's <button>) both followed the link AND
  // matched the row-open handler below, which re-renders #list synchronously
  // out from under the very click still bubbling through it; some clicks then
  // land twice, on the original element and its replacement. Bailing out
  // here, before ANY delegated handler below can act (or re-render anything),
  // leaves the browser's own click-through untouched.
  if (e.target.closest('a[href]')) return;
  const tab = e.target.closest('.tab');
  if (tab){
    state.tab = tab.dataset.tab;
    // A selection is only ever acted on from the tab it was made on: left
    // standing, the gutter's Archive/Hold would act on rows no longer shown.
    state.selected.clear();
    if (state.tab === 'messages' || state.tab === 'info' || state.tab === 'archived') {
      searchMessages();
      if (state.tab === 'archived') await loadArchivedMessages();
    }
    if ((state.tab === 'work' || state.tab === 'agents') && !state.workRead) await loadWork();
    renderList(); return;
  }
  const wchip = e.target.closest('[data-work-project],[data-work-sort]');
  if (wchip){
    if ('workSort' in wchip.dataset) state.workSort = wchip.dataset.workSort;
    else state.project = wchip.dataset.workProject;
    renderList(); return;
  }
  const goto = e.target.closest('[data-goto-work]');
  if (goto){
    // The work an agent is on, shown where the work is listed.
    Object.assign(state, {tab: 'work', project: ''});
    renderList();
    const row = document.getElementById('work-' + goto.dataset.gotoWork);
    if (row){ const fold = row.closest('details'); if (fold) fold.open = true; row.scrollIntoView({block: 'center'}); }
    return;
  }
  const wsend = e.target.closest('[data-work-send]');
  if (wsend){
    const id = wsend.dataset.workSend;
    const row = wsend.closest('.work-row');
    const input = row && row.querySelector('[data-work-answer]');
    const text = (input && input.value || '').trim();
    if (!text) return;
    await sendWorkAnswer(id, text);
    return;
  }
  // Every archive button: one click, no confirmation, and the pane moves on to
  // the next row in that same list (the previous one if it was the last, or
  // the empty state if the list is now empty) - checked before the row click
  // below, though it never nests inside `.item` anyway, since each row
  // builder puts it as a sibling, never a child, of the clickable button.
  const archiveItemBtn = e.target.closest('[data-archive-item]');
  if (archiveItemBtn){
    const key = archiveItemBtn.dataset.archiveItem;
    const it = (state.view.items || []).find(i => itemKey(i) === key);
    if (it){
      const wasArchiving = !isItemArchived(it);
      const keys = displayOrder(visible(), false, false, rowKey);
      setItemArchived(it, wasArchiving);
      if (wasArchiving && state.open === key) advanceTo(keys, key);
    }
    renderList();
    return;
  }
  const archiveMsgBtn = e.target.closest('[data-archive-msg]');
  if (archiveMsgBtn){
    await archiveMessageById(archiveMsgBtn.dataset.archiveMsg, true);
    return;
  }
  // His own note: the same one click, the same move to the next row.
  const noteBtn = e.target.closest('[data-archive-note], [data-hold-note], [data-unhold-note]');
  if (noteBtn){
    const d = noteBtn.dataset;
    const r = findNote(d.archiveNote || d.holdNote || d.unholdNote);
    if (r){
      const key = noteKey(r);
      const keys = displayOrder(visibleMessages().concat(listedNotes()), true, true,
        m => m.__note ? noteKey(m.__note) : msgKey(m));
      const leaving = d.archiveNote ? !r.archived : !!d.holdNote;
      if (d.archiveNote) setNoteArchived(r, !r.archived); else setNoteHeld(r, !!d.holdNote);
      if (leaving && state.open === key && state.tab === 'messages') { advanceTo(keys, key); return; }
    }
    render();
    return;
  }
  // Hold is only ever his own parking: nothing here is sent to firstmate, and
  // nothing here is server-durable, so this only ever touches browser state -
  // the same one-click, advance-to-next shape as Archive.
  const holdItemBtn = e.target.closest('[data-hold-item], [data-unhold-item]');
  if (holdItemBtn){
    const key = holdItemBtn.dataset.holdItem || holdItemBtn.dataset.unholdItem;
    const it = (state.view.items || []).find(i => itemKey(i) === key);
    if (it){
      const toHold = !isItemHeld(it);
      const keys = displayOrder(visible(), false, false, rowKey);
      setItemHeld(it, toHold);
      if (toHold && state.open === key) advanceTo(keys, key);
    }
    renderList();
    return;
  }
  const holdMsgBtn = e.target.closest('[data-hold-msg], [data-unhold-msg]');
  if (holdMsgBtn){
    const id = holdMsgBtn.dataset.holdMsg || holdMsgBtn.dataset.unholdMsg;
    const m = findMessageById(id);
    if (m){
      const toHold = !isMsgHeld(m);
      const keys = orderFor(msgKey(m));
      setMsgHeld(m, toHold);
      if (toHold && state.open === msgKey(m)) advanceTo(keys, msgKey(m));
    }
    renderList();
    return;
  }
  if (e.target.id === 'gutter-archive'){ gutterArchive(); return; }
  if (e.target.id === 'gutter-hold'){ gutterHold(); return; }
  if (e.target.id === 'gutter-delete' || e.target.id === 'bulk-delete'){ await armOrDelete(); return; }
  if (e.target.closest('[data-delete-open]')){ await armOrDelete([state.open]); return; }
  if (e.target.id === 'bulk-hold'){ bulkHoldSelected(); return; }
  if (e.target.id === 'bulk-archive'){ await bulkArchiveSelected(); return; }
  if (e.target.id === 'bulk-clear'){ state.selected.clear(); renderList(); return; }
  const openBtn = e.target.closest('[data-open]');
  if (openBtn){ open(openBtn.dataset.open); return; }
  const row = e.target.closest('.item');
  if (row){
    const key = row.dataset.key;
    if (key && selectable(key) && (e.shiftKey || e.ctrlKey || e.metaKey)){
      toggleMessageSelection(key, e);
      return;
    }
    if (key){
      if (state.selected.size){ state.selected.clear(); }
      selectAnchor = key;
      open(key);
    }
    return;
  }
  if (e.target.id === 'send'){ await sendReply(); return; }
  if (e.target.id === 'sendanyway'){
    // heldWith comes from bin/command-center-state.js: one deliberate decision
    // to send again releases that send on every surface it was held against,
    // so he never dismisses the same send twice.
    for (const k of heldWith(state.open, state.said, state.pending)){
      delete state.outcome[k];
      delete state.failed[k];
    }
    // And the record of a send still in flight, so the next load cannot read it
    // as one still going out and lock the box again. A send already RELEASED
    // locks nothing (isSending skips it), and its entry is the only record that
    // the page gave up on it: deciding to send again releases the lock, it does
    // not rewrite what happened before.
    for (const [sid, held] of Object.entries(state.pending))
      if (!held.released && (held.key === state.open || held.item === state.open))
        delete state.pending[sid];
    save('cc.outcome', state.outcome);
    save('cc.pending', state.pending); save('cc.failed', state.failed);
    renderMain(); return;
  }
  if (e.target.id === 'older'){ await loadOlder(); return; }
  if (e.target.id === 'clr'){
    state.q = ''; $('#q').value = ''; state.found = null; state.archivedFound = null; searchMessages();
    renderList(); return;
  }
  if (e.target.id === 'open-note'){ $('#note-dlg').showModal(); }
});

$('#grouping').addEventListener('change', e => { state.group = e.target.value; renderList(); });
$('#statefilter').addEventListener('change', e => { state.sfilter = e.target.value; renderList(); });
// A folded Done group stays as he left it across the 15-second repaint.
document.addEventListener('toggle', e => {
  const key = e.target.dataset && e.target.dataset.workDone;
  if (key === undefined) return;
  if (e.target.open) state.workDoneOpen.add(key); else state.workDoneOpen.delete(key);
}, true);
$('#projectfilter').addEventListener('change', e => { state.project = e.target.value; renderList(); });
// Only the Messages list is answered by the server; the other two tabs filter
// what the page already holds, so typing there asks the log for nothing.
$('#q').addEventListener('input', e => {
  state.q = e.target.value;
  if (state.tab === 'messages' || state.tab === 'info' || state.tab === 'archived') searchMessages();
  renderList();
});

// The note box keeps what he typed the same way the answer box does: a note
// that vanishes on a failed send is the loss this whole surface exists to end.
// The note box hangs off no item, so its own button is where its outcome is
// said.
function noteButtonLabel(){
  const f = state.failed.note;
  if (!f) return '✎  Tell firstmate something — not an answer';
  return f.outcome === 'unknown'
    ? '?  Your last note may already be saved — check before sending it again'
    : '✕  Your last note was not queued: ' + (f.detail || 'the command failed');
}

$('#note-text').value = state.note;
$('#note-text').addEventListener('input', e => {
  state.note = e.target.value; save('cc.note', state.note);
});
enterSends($('#note-text'), () => $('#note-dlg button[value="send"]'));
wireAttach($('#note-dlg'), 'note');
renderAttachStrip('note');

$('#note-dlg').addEventListener('close', async function(){
  const text = $('#note-text').value.trim();
  if (this.returnValue !== 'send' || !text) return;
  const btn = $('#open-note');
  const images = (state.images.note || []).map(im => im.id);
  let ok = false, data = {};
  try {
    ({ ok, data } = await post('/api/note', { text, images }));
  } catch (err) {
    // As on the answer path: the request never came back, so the server may
    // have started the note and been restarted before it could answer. A second
    // note is a second note - queue_note mints a fresh id - so delivery here is
    // unknown, never failed.
    data = transportFailure('note', String(err.message || err));
  }
  // Acceptance is not delivery: the server has his words, and the command has
  // not answered yet. So this claims only what it knows, his text stays in the
  // box, and the outcome lands on this same button when it arrives. Unknown
  // delivery never reads as a failure, because retyping it is how the captain
  // sends it twice.
  if (ok && data.ok){
    state.pending[data.sid] = {key: 'note', text, at: Date.now()};
    delete state.failed.note;
    delete state.images.note;
    save('cc.pending', state.pending); save('cc.failed', state.failed); save('cc.images', state.images);
    renderAttachStrip('note');
    btn.textContent = '✎  Written down — going out now';
  } else {
    btn.textContent = data.outcome === 'unknown'
      ? '?  It may already be saved — check before sending it again. '
        + (data.detail || '')
      : '✕  Not queued: ' + (data.error || data.detail || 'the command failed');
  }
  const hold = data.outcome === 'unknown' ? 12000 : 3500;
  state.noteFlash = Date.now() + hold;
  setTimeout(() => { btn.textContent = noteButtonLabel(); }, hold);
  await loadSaid(); render();
});

// The archived window is read once up front too, so a recorded answer to a
// message he already archived can show that message (answerFor) without his
// first opening Archived.
$('#grouping').value = state.group;
$('#statefilter').value = state.sfilter;
Promise.all([loadSaid(), loadMessages(), loadWork(), loadArchivedMessages(), loadPrs()]).then(([said]) => {
  reconcilePending(said.read);
  if (state.open) open(state.open); else renderList();
  return poll();
});
setInterval(poll, POLL_MS);
// The work board is cached ~15s server-side (bin/command-center.py's Work
// class) because it shells out to fm-bearings-snapshot.sh, which does bounded
// remote-ledger reads; polling it on the 3-second item cadence would buy
// nothing and cost every tab a slow request it does not need.
setInterval(async () => { await Promise.all([loadWork(), loadPrs()]); renderList(); }, 15000);
// The message log is a local file read, so it is polled on the same cadence and
// re-rendered only when a message actually arrived - his typing survives the
// re-render either way, because paintMain owns that.
// Only the LIST is redrawn: a recorded message never changes, and the open pane
// is built from the message it already holds and the said thread, so rebuilding
// it earns nothing and can only cost him his place.
// A search he left in the box is a view of the whole log, so it is asked again
// whenever the log moved: otherwise the newest message matching what he typed
// is the one message the page will not show him.
setInterval(async () => {
  const changed = await loadMessages();
  const failed = state.found && state.found.error && state.q.trim() === state.found.q;
  if ((changed || failed) && state.q.trim() && (state.tab === 'messages' || state.tab === 'info'))
    searchMessages();
  if (changed) renderList();
}, POLL_MS);
// The outcome of a send is written to the record by the thread carrying the
// delivery out, so the record is polled on the same cadence and behind the same
// change check. An unchanged record costs a stat.
setInterval(async () => {
  const said = await loadSaid();
  if (reconcilePending(said.read) || said.changed) render();
}, POLL_MS);
setInterval(renderList, 30000);   // keep the ages and stuck flags honest
</script>
</body>
</html>
